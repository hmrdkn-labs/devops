  - {title: DNS for Services and Pods, url: 'https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/'}
  - {title: EndpointSlices, url: 'https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/'}
