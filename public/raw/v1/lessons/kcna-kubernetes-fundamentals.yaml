schema_version: 1
id: lesson:kcna-kubernetes-fundamentals
slug: kcna-kubernetes-fundamentals
title: KCNA Kubernetes Fundamentals
summary: Build the Kubernetes mental model from network and container prerequisites through API state, reconciliation, component ownership, and proof.
revision: 1
certification: cncf:kcna
checkpoint: fundamentals
estimated_minutes: 18
verified_at: 2026-09-15
source_unit_ids:
  - fpp:kcna-domain-map
  - fpp:ip-subnets
  - fpp:ports-sockets-dns
  - fpp:container-lifecycle
  - fpp:git-yaml-declarative
  - fpp:kubernetes-control-loop
