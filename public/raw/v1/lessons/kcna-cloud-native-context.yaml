schema_version: 1
id: lesson:kcna-cloud-native-context
slug: kcna-cloud-native-context
title: KCNA Cloud-Native Context
summary: Connect Kubernetes to delivery, troubleshooting, observability, cloud-native architecture, release strategy, and the wider CNCF ecosystem.
revision: 1
certification: cncf:kcna
checkpoint: cloud-native
estimated_minutes: 20
verified_at: 2026-09-15
source_unit_ids:
  - fpp:cloud-native-delivery-gitops
  - fpp:troubleshoot-process-to-pod
  - fpp:cloud-native-release-debugging
  - fpp:cloud-native-observability-signals
  - fpp:cloud-native-architecture-principles
