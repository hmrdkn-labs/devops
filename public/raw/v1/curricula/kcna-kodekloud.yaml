schema_version: 1
id: curriculum:kcna-kodekloud
slug: kcna-kodekloud
title: KCNA course sequence
summary: A portable KCNA curriculum spine that follows KodeKloud's current module and lesson order while mapping every step to independently authored hmrdkn-labs learning material and practice.
revision: 2
verified_at: 2026-09-21
reference:
  title: Kubernetes & Cloud-native Associate (KCNA) Course
  publisher: KodeKloud
  url: https://kodekloud.com/courses/kubernetes-and-cloud-native-associate-kcna
modules:
  - id: curriculum:kcna/introduction
    slug: introduction
    title: Introduction
    summary: Establish the course scope and the mental map used throughout the KCNA path.
