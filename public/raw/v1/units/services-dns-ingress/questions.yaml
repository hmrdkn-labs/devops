schema_version: 1
unit_id: fpp:services-dns-ingress
revision: 5
questions:
  - id: fpp:services-dns-ingress/q-no-endpoints
    kind: scenario
    prompt: A Service DNS name resolves, but its EndpointSlice is empty. What works and what is broken?
    model_answer: Service discovery works, but no ready Pods match the Service selector or port relationship. Inspect selector labels, Pod readiness, and EndpointSlice controller output.
    critical_points:
      - DNS and backend selection are separate.
      - A Service with no endpoints cannot deliver to a workload.
    objective_ids: [fpp:services-dns-ingress/service-endpoints]
  - id: fpp:services-dns-ingress/q-ingress
    kind: explain
    prompt: Why does creating an Ingress object not guarantee an external endpoint?
    model_answer: Ingress is desired-state API configuration. An installed controller must recognize its class, configure a proxy or load balancer, publish status, and have working DNS and network access.
    critical_points:
      - An implementing controller is required.
      - External DNS and load-balancer lifecycle are separate integrations.
    objective_ids: [fpp:services-dns-ingress/external-routing]
  - id: fpp:services-dns-ingress/q-practice-transfer
    kind: scenario
    prompt: "An Ingress rule maps shop.example/ to Service shop port 80. The API accepts the Ingress, but no Ingress controller is installed. Does the stored rule itself forward browser traffic, and what evidence separates declared routing from implementation?"
    model_answer: "No. Ingress is API configuration; a suitable Ingress controller and its proxy/load balancer must implement it. Inspect IngressClass/controller availability, Ingress events/status and the actual external endpoint before sending a browser request. A stored rule is not proof that any data plane forwards traffic."
    critical_points:
      - "Ingress API intent needs an implementing controller."
      - "External endpoint and request evidence test actual forwarding."
    objective_ids: [fpp:services-dns-ingress/service-endpoints, fpp:services-dns-ingress/external-routing]

  - id: fpp:services-dns-ingress/q-stable-service
    kind: predict
    prompt: A Deployment replaces every Pod during a rollout. Why can clients keep using the same Service name and ClusterIP even though all backend Pod IPs change?
    model_answer: The Service is a stable virtual identity above replaceable Pods. Its selector and EndpointSlice membership are updated as ready matching Pods change, while clients continue using the Service DNS name and virtual IP.
    critical_points:
      - Service identity is stable across Pod replacement.
      - Endpoint membership tracks the current ready backends.
    objective_ids: [fpp:services-dns-ingress/service-endpoints]
  - id: fpp:services-dns-ingress/q-no-controller
    kind: scenario
    prompt: An Ingress object exists and validates successfully, but the cluster has no compatible Ingress controller. What has been proven and what should you expect for traffic?
    model_answer: Only the desired API configuration has been accepted. Without a controller that watches the Ingress and configures a proxy or load balancer, no data-plane routing is created from that object, so external traffic should not be expected to work from the Ingress alone.
    critical_points:
      - Ingress is configuration consumed by an implementing controller.
      - API acceptance does not prove an external data plane exists.
    objective_ids: [fpp:services-dns-ingress/external-routing]
  - id: fpp:services-dns-ingress/q-listener-port
    kind: scenario
    prompt: catalog's Service exposes port 80 and targetPort 8080. Its Pod declares containerPort 8080, but the application listens on 3000. Does the declaration create a working listener, and which relationship needs correction?
    model_answer: No. containerPort describes port intent and image EXPOSE is metadata; neither starts or publishes an application listener. Clients use Service port 80, but forwarding must reach the process's actual port through targetPort. Align the application listener and Service mapping, then test a request from the intended client; valid declarations and selected endpoints alone are insufficient.
    critical_points:
      - Service port, targetPort and actual listener are different relationships.
      - A port declaration does not execute a listening process.
    objective_ids: [fpp:services-dns-ingress/service-endpoints]
  - id: fpp:services-dns-ingress/q-mesh-path
    kind: explain
    prompt: Trace an external request through a mesh gateway to catalog and catalog's internal call to inventory in a sidecar mesh. Where do proxies execute traffic, and where does the mesh control plane belong?
    model_answer: The external client reaches the gateway proxy, then catalog's workload proxy and application; catalog's internal call traverses its local proxy and inventory's proxy before reaching inventory. The mesh control plane distributes routes/policies/certificates to proxies instead of forwarding every request. Exact interception and gateway placement depend on configuration; verify enrolled workloads, proxy configuration and transaction evidence. A mesh is optional and does not replace Kubernetes Pod connectivity.
    critical_points:
      - Entry gateway and internal workload proxies occupy different request boundaries.
      - Control-plane configuration does not add a business-request proxy hop.
    objective_ids: [fpp:services-dns-ingress/mesh-path, fpp:services-dns-ingress/external-routing]
