schema_version: 1
unit_id: fpp:kubernetes-pod-model
revision: 4
questions:
  - id: fpp:kubernetes-pod-model/q-delete
    kind: predict
    prompt: A Deployment has three healthy Pods. You delete one Pod manually. Who replaces it, and what changes about the replacement?
    model_answer: The ReplicaSet controller detects that the number of matching Pods fell below its desired replica count and creates a new Pod. The replacement is a new Pod object with a new UID and potentially a different node and Pod IP.
    critical_points:
      - ReplicaSet reconciles the replica count.
      - Replacement creates a new Pod identity rather than reviving the deleted Pod.
    objective_ids: [fpp:kubernetes-pod-model/ownership]
  - id: fpp:kubernetes-pod-model/q-running
    kind: scenario
    prompt: A Pod shows phase Running, but the application is unusable and the restart count keeps increasing. Why is that not contradictory?
    model_answer: Pod phase is a coarse lifecycle summary. A Pod can remain Running while one container repeatedly exits and the kubelet restarts it. Inspect container state, last termination reason, restart count, conditions, events, and logs for the actual failure.
    critical_points:
      - Pod phase is not a complete health signal.
      - Container restart can occur inside the same Pod identity.
    objective_ids: [fpp:kubernetes-pod-model/lifecycle]
  - id: fpp:kubernetes-pod-model/q-practice-transfer
    kind: scenario
    prompt: "Pod UID=p7 has restartCount rising from 0 to 4. Later p7 is deleted; ReplicaSet/api-55's desired count remains three, its matching count falls to two, and a SuccessfulCreate event names api-55-y with new UID=p8. That Pod is owned by api-55 and assigned node-b. Which transition is node-side restart and which is count-repair replacement? What evidence rules out migration?"
    model_answer: "The increasing restart count with UID p7 identifies container restart within one Pod, performed by kubelet according to restart policy. The deletion, unchanged desired count, matching-count deficit and ReplicaSet SuccessfulCreate event support count repair by creating p8. Its new UID proves a different Pod, not migration of p7; node-b records its placement. Compare the event, UIDs, owner references, replica counts and container lastState. New UID plus ownership alone would not establish this history: scaling or adoption could also produce another owned Pod."
    critical_points:
      - "Same Pod UID with increasing restart count distinguishes container restart."
      - "Deletion, unchanged desired count, deficit and SuccessfulCreate support count-repair replacement; new UID proves distinct identity, not the cause by itself."
    objective_ids: [fpp:kubernetes-pod-model/lifecycle, fpp:kubernetes-pod-model/ownership]

  - id: fpp:kubernetes-pod-model/q-restart-vs-replace
    kind: explain
    prompt: What is the identity difference between a container restart inside one Pod and a controller replacing a failed Pod?
    model_answer: A container restart is performed by the kubelet inside the same Pod object, so the Pod UID stays the same while restart count and container state change. A controller replacement creates a new Pod object with a new UID and potentially a new node and Pod IP.
    critical_points:
      - Container restart can preserve Pod identity.
      - Pod replacement always creates a new Pod identity.
    objective_ids: [fpp:kubernetes-pod-model/lifecycle, fpp:kubernetes-pod-model/ownership]
  - id: fpp:kubernetes-pod-model/q-init-container
    kind: scenario
    prompt: A Pod never reaches its application container because an init container repeatedly fails. Which status and logs matter first, and why would application-container logs be weak evidence?
    model_answer: Inspect the init container states, termination reason, restart behavior, events, and the init container's current or previous logs. The application container may not have started at all, so its logs cannot explain a failure that occurs earlier in the Pod lifecycle.
    critical_points:
      - Init containers gate later application-container startup.
      - Evidence should come from the lifecycle stage that actually failed.
    objective_ids: [fpp:kubernetes-pod-model/lifecycle]
