schema_version: 1
unit_id: fpp:cloud-native-observability-signals
revision: 3
questions:
  - id: fpp:cloud-native-observability-signals/q-latency
    kind: scenario
    prompt: An API's p95 latency metric suddenly rises, but the metric alone does not show which downstream service is slow. Which signal is best suited to follow individual requests across service boundaries?
    model_answer: Distributed traces are best suited to follow individual operations across services and show which spans consumed time. Metrics establish the population-level symptom; traces can localize a request path; logs can then explain a component-specific cause.
    critical_points:
      - Metrics and traces answer different questions.
      - Traces connect causal work across service boundaries.
    objective_ids: [fpp:cloud-native-observability-signals/signals]
  - id: fpp:cloud-native-observability-signals/q-otel
    kind: explain
    prompt: Why is OpenTelemetry not simply a replacement name for Prometheus?
    model_answer: OpenTelemetry is a vendor-neutral instrumentation and telemetry pipeline ecosystem for traces, metrics, and logs, including the Collector. Prometheus is primarily a metrics monitoring system with a time-series data model, scraping/querying, and alert-rule evaluation. They can integrate rather than replace each other one-for-one.
    critical_points:
      - OpenTelemetry focuses on generating/processing/exporting telemetry across signal types.
      - Prometheus is a metrics-oriented monitoring and query system.
    objective_ids: [fpp:cloud-native-observability-signals/tools]
  - id: fpp:cloud-native-observability-signals/q-practice-transfer
    kind: scenario
    prompt: "Between 14:00 and 14:05 checkout p95 rises from 120ms to 2s. Prometheus up=1 for checkout, and one trace shows an inventory span taking 1.8s with a timeout log under the same trace ID. The Collector reports successful exports. What can you localize, what is still only a hypothesis, and what evidence proves recovery?"
    model_answer: "The metric quantifies a population symptom; the trace localizes most delay in that sampled request to the inventory call; the correlated log supports a timeout at that boundary. It does not prove every slow request has the same cause or why inventory timed out. Prometheus up and Collector export success prove telemetry-path health, not checkout health. Compare more requests and inventory-side evidence, then repeat a representative checkout transaction and watch latency/error metrics over the recovery window."
    critical_points:
      - "Metrics, a sampled trace and correlated logs have different scopes; timeout location is not root cause."
      - "Successful scraping/export is not recovery; transaction outcomes and population signals are needed."
    objective_ids: [fpp:cloud-native-observability-signals/signals, fpp:cloud-native-observability-signals/tools]
