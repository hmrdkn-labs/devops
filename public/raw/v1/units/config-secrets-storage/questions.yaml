schema_version: 1
unit_id: fpp:config-secrets-storage
revision: 3
questions:
  - id: fpp:config-secrets-storage/q-fresh
    kind: predict
    prompt: Can every brand-new EKS cluster dynamically provision an EBS PVC immediately with no additional setup?
    model_answer: No. Dynamic EBS provisioning requires the EBS CSI driver, its IAM permissions, and a compatible StorageClass. Cluster creation alone does not guarantee that whole data path.
    critical_points:
      - CSI implementation and permissions are required.
      - A StorageClass selects provisioning behavior.
    objective_ids: [fpp:config-secrets-storage/pv-topology]
  - id: fpp:config-secrets-storage/q-az
    kind: scenario
    prompt: An AZ fails. Can a Pod automatically move to another AZ and reattach the same EBS volume?
    model_answer: Not the same zonal EBS volume. The scheduler must place the Pod where the volume is accessible; cross-AZ recovery needs replicated storage, restore from backup or snapshot, or an application-level failover design.
    critical_points:
      - EBS volumes have AZ topology.
      - Pod rescheduling cannot erase storage failure domains.
    objective_ids: [fpp:config-secrets-storage/pv-topology]
  - id: fpp:config-secrets-storage/q-practice-transfer
    kind: scenario
    prompt: "Reports uses ConfigMap MODE=fast through an environment variable and writes exports to a bound PVC. MODE changes to safe, then the Deployment replaces a Pod while the PVC remains. A teammate also proposes storing the report API key in that ConfigMap. Predict configuration and data reuse, choose the credential boundary, and name evidence without revealing the key."
    model_answer: "The existing process keeps its environment value; a newly started process receives safe. The replacement can reuse the unchanged claim where volume topology and access rules permit. MODE belongs in non-confidential configuration; the API key needs controlled Secret or external-secret delivery, not a ConfigMap. Secret manifest base64 is not encryption. Check a non-sensitive mode diagnostic, credential reference/access policy, PVC/PV binding, topology, mount events and an existing export. Do not print the credential; API records alone do not prove application consumption."
    critical_points:
      - "Environment-based configuration is captured when the process starts."
      - "Confidential credentials need protected Secret or external delivery; base64 does not encrypt them."
      - "An unchanged PVC can outlive a Pod; topology and a successful mount still matter."
    objective_ids: [fpp:config-secrets-storage/config-secret, fpp:config-secrets-storage/pv-topology]
