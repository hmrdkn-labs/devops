schema_version: 1
unit_id: fpp:config-secrets-storage
revision: 2
questions:
  - id: fpp:config-secrets-storage/q-fresh
    kind: predict
    prompt: Can every brand-new EKS cluster dynamically provision an EBS PVC immediately with no additional setup?
    model_answer: No. Dynamic EBS provisioning requires the EBS CSI driver, its IAM permissions, and a compatible StorageClass. Cluster creation alone does not guarantee that whole data path.
    critical_points:
      - CSI implementation and permissions are required.
      - A StorageClass selects provisioning behavior.
    objective_ids: [fpp:config-secrets-storage/pv-topology]
  - id: fpp:config-secrets-storage/q-az
    kind: scenario
    prompt: An AZ fails. Can a Pod automatically move to another AZ and reattach the same EBS volume?
    model_answer: Not the same zonal EBS volume. The scheduler must place the Pod where the volume is accessible; cross-AZ recovery needs replicated storage, restore from backup or snapshot, or an application-level failover design.
    critical_points:
      - EBS volumes have AZ topology.
      - Pod rescheduling cannot erase storage failure domains.
    objective_ids: [fpp:config-secrets-storage/pv-topology]
  - id: fpp:config-secrets-storage/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Inspect an existing non-production claim and explain every ownership boundary. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Read the PVC, bound PV, StorageClass, CSI driver, and selected Pod. Record access mode, reclaim policy, volume mode, and topology. State what happens on Pod deletion, claim deletion, node loss, and AZ loss. Treat the conclusion as justified only when You distinguish Pod, claim, volume, and cloud-resource lifecycle. Your AZ answer matches the storage topology."
    critical_points:
      - "You distinguish Pod, claim, volume, and cloud-resource lifecycle."
      - "Your AZ answer matches the storage topology."
    objective_ids: [fpp:config-secrets-storage/config-secret, fpp:config-secrets-storage/pv-topology]
