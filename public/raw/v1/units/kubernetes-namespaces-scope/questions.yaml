schema_version: 1
unit_id: fpp:kubernetes-namespaces-scope
revision: 4
questions:
  - id: fpp:kubernetes-namespaces-scope/q-same-name
    kind: explain
    prompt: How can two Deployments both be named web in one Kubernetes cluster without referring to the same object?
    model_answer: Deployments are namespaced resources, so their identity includes namespace. Deployment/web in team-a and Deployment/web in team-b are distinct API objects.
    critical_points:
      - Deployment is namespaced.
      - Namespace participates in object identity for namespaced resources.
    objective_ids: [fpp:kubernetes-namespaces-scope/scope]
  - id: fpp:kubernetes-namespaces-scope/q-security
    kind: scenario
    prompt: Two teams are placed in separate namespaces. Can you now assume their Pods cannot communicate and their users cannot read each other's objects?
    model_answer: No. Namespace alone does not provide those guarantees. API access requires appropriate RBAC or other authorization controls, and Pod-to-Pod traffic isolation requires NetworkPolicy or another network-policy mechanism supported by the cluster.
    critical_points:
      - Namespace is not automatic authorization.
      - Namespace is not automatic network isolation.
    objective_ids: [fpp:kubernetes-namespaces-scope/boundary]
  - id: fpp:kubernetes-namespaces-scope/q-practice-transfer
    kind: scenario
    prompt: "team-a and team-b each have Service/api. A Pod in team-a calls api:8080 and reaches team-a, but calling api.team-b:8080 reaches team-b. A team-a user also lists team-b Pods successfully. Does namespace separation malfunction? Explain the identities and which controls you would inspect."
    model_answer: "No. The short Service name resolves using the caller's namespace search context; api.team-b explicitly names the other namespace under normal cluster DNS configuration. Namespaces distinguish API objects but do not automatically deny cross-namespace traffic or API reads. Inspect effective authorization for team-b and applicable NetworkPolicies plus enforcement support. Node identity remains cluster-scoped even when a lookup carries -n team-a."
    critical_points:
      - "Service identities and namespace-qualified discovery distinguish the two api objects."
      - "Authorization and network isolation require separate controls; namespace creation alone denies neither."
    objective_ids: [fpp:kubernetes-namespaces-scope/scope, fpp:kubernetes-namespaces-scope/boundary]

  - id: fpp:kubernetes-namespaces-scope/q-node-scope
    kind: predict
    prompt: If you run kubectl get nodes -n team-a, does the namespace flag make Node objects belong to team-a?
    model_answer: No. Nodes are cluster-scoped resources, so their identity does not include a namespace. A namespace flag may be irrelevant for that resource type; it does not transform cluster-scoped objects into namespaced ones.
    critical_points:
      - Resource scope is defined by the Kubernetes API type.
      - Namespace flags do not change a cluster-scoped resource's identity.
    objective_ids: [fpp:kubernetes-namespaces-scope/scope]
  - id: fpp:kubernetes-namespaces-scope/q-service-name
    kind: scenario
    prompt: team-a and team-b each have a Service named api. Why can both exist, and what name should a client use when it must unambiguously reach the Service in team-b?
    model_answer: Namespaced resource identity includes the namespace, so both Services can be named api. A client can use a namespace-qualified DNS name such as api.team-b or the full Service DNS name to explicitly address the team-b Service.
    critical_points:
      - The namespace is part of a namespaced object's identity.
      - Cross-namespace discovery should use a namespace-qualified Service name.
    objective_ids: [fpp:kubernetes-namespaces-scope/scope]
