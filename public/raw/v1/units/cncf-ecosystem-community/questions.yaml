schema_version: 1
unit_id: fpp:cncf-ecosystem-community
revision: 4
questions:
  - id: fpp:cncf-ecosystem-community/q-landscape
    kind: explain
    prompt: Why should you not interpret the CNCF Landscape as a single recommended stack that every Kubernetes cluster must install?
    model_answer: The Landscape is a catalog of a broad ecosystem across many categories and maturity/commercial relationships. Kubernetes can use different implementations and does not require every listed project. Study the responsibilities and interfaces rather than treating the catalog as one architecture.
    critical_points:
      - Landscape inclusion is not a requirement to install the project.
      - Responsibilities and interfaces are more important than memorizing logos.
    objective_ids: [fpp:cncf-ecosystem-community/projects]
  - id: fpp:cncf-ecosystem-community/q-cni
    kind: scenario
    prompt: Someone says "CNI routes our packets." What small adjustment makes that statement more precise?
    model_answer: CNI is an interface/convention used by network implementations to configure container or Pod networking. The actual plugin/dataplane implementation, routes, eBPF programs, bridges, or other mechanisms execute connectivity and forwarding.
    critical_points:
      - Interface/specification is distinct from implementation.
      - The concrete network dataplane executes packet handling.
    objective_ids: [fpp:cncf-ecosystem-community/projects]
  - id: fpp:cncf-ecosystem-community/q-practice-transfer
    kind: scenario
    prompt: "An architecture proposal says installing every CNCF Landscape logo will make the platform interoperable. It also assigns packet forwarding to CNI and container execution to the CRI specification. Rewrite those ownership claims and identify where a networking contract question should go for upstream collaboration."
    model_answer: "The Landscape is a catalog, not an installation prescription. Select implementations for actual requirements: a network implementation uses CNI conventions to configure networking and its dataplane handles packets; kubelet uses CRI to ask a runtime such as containerd to execute containers. Specifications are contracts, not running executors. Consult the relevant specification/project maintainers and Kubernetes SIG Network for the integration question, using a minimal reproduction and version/interface evidence rather than logos."
    critical_points:
      - "Catalog entries and interface specifications do not execute a platform."
      - "Concrete implementations own execution; upstream collaboration follows project/interface and SIG responsibility."
    objective_ids: [fpp:cncf-ecosystem-community/projects, fpp:cncf-ecosystem-community/community]
  - id: fpp:cncf-ecosystem-community/q-kep-release
    kind: predict
    prompt: A Kubernetes enhancement has an approved KEP and discussion in SIG Network. Does that prove your current cluster implements it, and what is the role of the SIG compared with a CNI plugin?
    model_answer: No. A KEP records a proposed change and its design/testing/graduation plan; inspect release status, served capabilities and feature-gate configuration for the cluster version. SIG Network coordinates contributors and ownership in the networking area, whereas an installed CNI implementation and its dataplane perform network setup/traffic work. Neither an approved document nor a contributor group is a worker-node executor.
    critical_points:
      - Proposal approval and released/enabled capability are separate evidence.
      - Community ownership is not runtime execution.
    objective_ids: [fpp:cncf-ecosystem-community/community, fpp:cncf-ecosystem-community/projects]
