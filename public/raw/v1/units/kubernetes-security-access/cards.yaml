schema_version: 1
unit_id: fpp:kubernetes-security-access
revision: 6
cards:
  - id: fpp:kubernetes-security-access/c-authn
    type: short
    front: What question does authentication answer?
    back: Who is making the request?
    critical_points: []
    objective_ids: [fpp:kubernetes-security-access/request]
  - id: fpp:kubernetes-security-access/c-authz
    type: short
    front: What question does authorization answer?
    back: May this authenticated identity perform this action on this resource?
    critical_points: []
    objective_ids: [fpp:kubernetes-security-access/request]
  - id: fpp:kubernetes-security-access/c-binding
    type: short
    front: In RBAC, what attaches Role or ClusterRole permissions to subjects?
    back: A RoleBinding or ClusterRoleBinding.
    critical_points: []
    objective_ids: [fpp:kubernetes-security-access/request]
  - id: fpp:kubernetes-security-access/c-secret
    type: prompt
    front: Why is base64 in a Kubernetes Secret not the same as encryption?
    back: Base64 is reversible encoding. Secret confidentiality depends on authorization, encryption at rest, transport protection, careful delivery, and preventing accidental exposure.
    critical_points: [Encoding does not provide confidentiality]
    objective_ids: [fpp:kubernetes-security-access/workload]
  - id: fpp:kubernetes-security-access/c-namespace
    type: scenario
    front: Two teams use separate namespaces. Does that automatically block network traffic between their Pods?
    back: No. Namespace separation is API scope and organization; network isolation requires applicable policy enforced by the cluster network implementation.
    critical_points: [Namespace is not automatically a network firewall]
    objective_ids: [fpp:kubernetes-security-access/workload]
  - id: fpp:kubernetes-security-access/c-context
    type: short
    front: What three access settings does a kubeconfig context join?
    back: A cluster entry, a user/credential entry, and an optional default namespace.
    critical_points: []
    objective_ids: [fpp:kubernetes-security-access/client-trust]
  - id: fpp:kubernetes-security-access/c-core-group
    type: short
    front: What API group string does an RBAC rule use for core resources such as Pods?
    back: The empty string, not v1. The version and group are different fields.
    critical_points: []
    objective_ids: [fpp:kubernetes-security-access/client-trust]
  - id: fpp:kubernetes-security-access/c-ca-permission
    type: prompt
    front: Explain why a trusted client certificate does not automatically grant cluster-admin rights.
    back: Certificate validation can establish caller identity; authorization still checks that identity's permitted verbs, resources and scope. Server TLS trust and client authentication are also separate from authorization.
    critical_points: [Trust and identity do not imply all permissions]
    objective_ids: [fpp:kubernetes-security-access/client-trust, fpp:kubernetes-security-access/request]
  - id: fpp:kubernetes-security-access/c-pull-secret
    type: scenario
    front: Does an imagePullSecret make a downloaded image trustworthy or prevent it from running privileged?
    back: No. It authenticates to a registry. Artifact trust/scanning, admission policies and execution securityContext restrictions address different boundaries.
    critical_points: [Registry authentication is not artifact or process safety]
    objective_ids: [fpp:kubernetes-security-access/artifact-execution]
