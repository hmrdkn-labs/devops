schema_version: 1
unit_id: fpp:kubernetes-security-access
revision: 4
questions:
  - id: fpp:kubernetes-security-access/q-kubeconfig
    kind: scenario
    prompt: A user has a valid kubeconfig credential for a cluster but receives Forbidden when listing Secrets. Is authentication broken?
    model_answer: Not necessarily. Successful authentication can establish the user's identity while authorization denies the requested action. Inspect RBAC or the configured authorization policy rather than treating a valid credential as proof of permission.
    critical_points:
      - Authentication and authorization are separate checks.
      - A valid identity does not imply permission to every resource.
    objective_ids: [fpp:kubernetes-security-access/request]
  - id: fpp:kubernetes-security-access/q-controls
    kind: explain
    prompt: Why can RBAC, Pod Security Admission, and NetworkPolicy all be required for the same application?
    model_answer: They protect different boundaries. RBAC limits Kubernetes API operations, Pod Security Admission constrains the privileges and host access a Pod may request, and NetworkPolicy constrains allowed network flows when supported by the dataplane.
    critical_points:
      - API permissions, workload privilege, and network connectivity protect distinct security boundaries.
      - One control does not replace the other two.
    objective_ids: [fpp:kubernetes-security-access/workload]
  - id: fpp:kubernetes-security-access/q-practice-transfer
    kind: scenario
    prompt: "ServiceAccount deployer can create Pods in sandbox. Its request for a privileged Pod is rejected by Pod Security Admission. A separate request to list Secrets returns Forbidden. Which request boundaries denied each action, and why would relaxing NetworkPolicy fix neither?"
    model_answer: "The privileged Pod create passed identity and API authorization but admission rejected the proposed workload privileges. Secret listing was denied at API authorization for that verb/resource/scope. NetworkPolicy governs supported Pod network flows, not API RBAC permission or admission rules. Inspect the exact admission rejection and a scoped authorization check plus bindings; do not assume the same policy denied both requests."
    critical_points:
      - "Authorization permits an API action; admission can still reject the object."
      - "Network flow policy cannot grant API rights or bypass workload admission."
    objective_ids: [fpp:kubernetes-security-access/request, fpp:kubernetes-security-access/workload]

  - id: fpp:kubernetes-security-access/q-request-chain
    kind: scenario
    prompt: An API request has a valid client identity, RBAC allows the requested verb, but an admission policy rejects the object. Which stages succeeded and which stage denied the request?
    model_answer: Authentication succeeded by establishing identity, and authorization succeeded by permitting the verb on the resource. Admission then rejected the proposed object or mutation, so the request fails even though the caller was both known and authorized.
    critical_points:
      - Authentication, authorization, and admission are separate request stages.
      - Authorization success does not bypass admission policy.
    objective_ids: [fpp:kubernetes-security-access/request]
  - id: fpp:kubernetes-security-access/q-serviceaccount-cloud-identity
    kind: explain
    prompt: Why can a Pod obtain cloud credentials through workload identity without storing a long-lived cloud access key in a Kubernetes Secret?
    model_answer: The Pod can use its Kubernetes ServiceAccount identity and a configured federation or workload-identity integration to request short-lived cloud credentials. The trust mapping is external to a static Secret, so Kubernetes identity and cloud authorization remain separate but connected control boundaries.
    critical_points:
      - Workload identity can exchange Kubernetes identity for short-lived cloud credentials.
      - A static Kubernetes Secret containing long-lived cloud keys is not required by that model.
    objective_ids: [fpp:kubernetes-security-access/workload]
