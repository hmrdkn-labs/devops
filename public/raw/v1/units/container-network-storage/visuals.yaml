schema_version: 1
unit_id: fpp:container-network-storage
revision: 3
visuals:
  - id: fpp:container-network-storage/visual-boundaries
    kind: ownership
    eyebrow: Isolation boundary
    title: "One host endpoint, two different storage lifetimes"
    lines:
      - "host localhost:18080 → Docker forwarding → container :8080"
      - "container /data → retained volume notes → survives recreation"
      - "container /tmp → instance writable layer → lost on removal"
      - "same-container restart ≠ remove/create replacement"
    teaching_point: "Host publication and container listener are separate endpoints. A retained named volume survives removal/recreation; the writable layer does not. Loopback publication describes a scoped path, not all possible access routes."
