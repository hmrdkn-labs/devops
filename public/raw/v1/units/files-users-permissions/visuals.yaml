unit_id: fpp:files-users-permissions
revision: 3
visuals:
  - id: fpp:files-users-permissions/visual-access-check
    kind: flow
    eyebrow: Access decision
    title: "A directory can hide names without protecting known files"
    lines:
      - "UID 1200 → /srv traversal succeeds"
      - "reports mode 0300 → listing denied; known-name lookup allowed"
      - "daily.txt mode 0400 → open/read allowed"
      - "reports write + search → unlink allowed under stated assumptions"
    teaching_point: "Directory read lists names; search reaches a known name. Unlink permission is primarily on the parent directory, not the file write bit. The prediction depends on the explicitly unprivileged identity and absent additional restrictions."
