schema_version: 1
unit_id: fpp:files-users-permissions
revision: 2
questions:
  - id: fpp:files-users-permissions/q-directory-x
    kind: predict
    prompt: A file is world-readable, but its parent directory lacks execute permission for your user. Can you read it by path?
    model_answer: No. Directory execute permission is required to traverse the directory and resolve the named entry, even if the final file has a read bit.
    critical_points:
      - Directory execute means traversal.
      - Every path component participates in access.
    objective_ids: [fpp:files-users-permissions/mode-bits]
  - id: fpp:files-users-permissions/q-identity
    kind: explain
    prompt: Why should a service use a stable non-root user instead of relying on root?
    model_answer: A stable least-privilege identity limits blast radius and makes required ownership explicit. Root can conceal bad permissions and leaves privileged artifacts that break later non-root execution.
    critical_points:
      - Identity controls kernel permission checks.
      - Least privilege supports repeatable operation as well as security.
    objective_ids: [fpp:files-users-permissions/path-identity]
  - id: fpp:files-users-permissions/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Create a temporary directory tree and predict access before changing each mode. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Create a private temporary directory containing one readable file. Remove directory read permission, then test access by exact filename. Restore read and remove execute permission, then test again. Treat the conclusion as justified only when You can explain listing versus traversal. You restore or remove the temporary directory afterward."
    critical_points:
      - "You can explain listing versus traversal."
      - "You restore or remove the temporary directory afterward."
    objective_ids: [fpp:files-users-permissions/path-identity, fpp:files-users-permissions/mode-bits]
