schema_version: 1
unit_id: fpp:scheduling-resources-health
revision: 4
questions:
  - id: fpp:scheduling-resources-health/q-bigger
    kind: predict
    prompt: Will doubling an EC2 worker's CPU and memory always double the Pods it can run?
    model_answer: No. Requests may not scale evenly, and pod-IP limits, maximum pods, daemon overhead, storage attachments, topology, or other node constraints may become the bottleneck.
    critical_points:
      - Capacity is multidimensional.
      - The scheduler uses declared requests and constraints.
    objective_ids: [fpp:scheduling-resources-health/requests-limits]
  - id: fpp:scheduling-resources-health/q-probe
    kind: scenario
    prompt: A shared database fails and every application liveness probe checks it. What harmful behavior can follow?
    model_answer: Kubelet may restart otherwise healthy application processes across the fleet, adding startup load and hiding the real dependency failure. The shared dependency usually belongs in readiness or external monitoring, not liveness.
    critical_points:
      - Restart must be a plausible repair.
      - Liveness should avoid shared dependency coupling.
    objective_ids: [fpp:scheduling-resources-health/probe-semantics]
  - id: fpp:scheduling-resources-health/q-practice-transfer
    kind: scenario
    prompt: "node-a has allocatable CPU=2000m and memory=4Gi; existing ordinary Pod requests total 1700m and 2Gi. A new single-container Pod requests 400m and 1Gi, while actual CPU usage is only 200m. It also has a liveness probe that fails whenever the shared database is down. Predict placement and explain the separate risk after the Pod eventually runs."
    model_answer: "It does not fit node-a's remaining CPU request budget: 2000m minus 1700m leaves 300m, below 400m. Low measured usage does not erase the reservation. Scheduler events and requests provide placement evidence; other nodes and constraints must still be checked. Once running, dependency-coupled liveness can cause kubelet restarts during a database outage even when restarting this process cannot repair the database. Probe events and restart counts distinguish that runtime failure from Pending placement."
    critical_points:
      - "Remaining CPU is 300m by requests; 400m cannot fit despite low current usage."
      - "Scheduler feasibility and kubelet liveness restarts are different boundaries."
    objective_ids: [fpp:scheduling-resources-health/requests-limits, fpp:scheduling-resources-health/probe-semantics]

  - id: fpp:scheduling-resources-health/q-request-vs-limit
    kind: explain
    prompt: Why can a Pod with a CPU request of 250m and a CPU limit of 1 CPU be scheduled onto a node that does not have a full free CPU available by current usage?
    model_answer: The scheduler primarily reserves feasibility against declared requests, not instantaneous usage and not the CPU limit as if it were guaranteed capacity. The Pod requests 250m for placement, while the higher limit constrains how much CPU it may consume at runtime.
    critical_points:
      - Requests drive scheduler reservation and feasibility.
      - Limits constrain runtime consumption rather than reserving that whole amount for scheduling.
    objective_ids: [fpp:scheduling-resources-health/requests-limits]
  - id: fpp:scheduling-resources-health/q-startup-readiness-liveness
    kind: scenario
    prompt: A slow-starting application needs 90 seconds to initialize, should receive no traffic until initialization finishes, and should be restarted only if it later becomes irrecoverably stuck. How should startup, readiness, and liveness probes divide those jobs?
    model_answer: A startup probe protects the long initialization period from premature liveness failure. Readiness controls whether the Pod receives Service traffic. Liveness should detect a failure that restarting the container can plausibly repair after startup has succeeded.
    critical_points:
      - Startup protects initialization from liveness checks.
      - Readiness gates traffic while liveness decides restart behavior.
    objective_ids: [fpp:scheduling-resources-health/probe-semantics]
