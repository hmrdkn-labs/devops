schema_version: 1
unit_id: fpp:namespaces-cgroups
revision: 3
questions:
  - id: fpp:namespaces-cgroups/q-difference
    kind: explain
    prompt: What question do namespaces answer, and what different question do cgroups answer?
    model_answer: Namespaces define the resources and identities a process can see. Cgroups group processes to account for, prioritize, and limit their resource consumption.
    critical_points:
      - Namespaces scope visibility.
      - Cgroups control resource use.
    objective_ids: [fpp:namespaces-cgroups/isolation, fpp:namespaces-cgroups/resource-control]
  - id: fpp:namespaces-cgroups/q-memory
    kind: scenario
    prompt: The host has free memory, but one container is OOM-killed after crossing its limit. How can both facts be true?
    model_answer: The process belongs to a memory cgroup with a lower boundary than total host memory. Enforcement occurs at the cgroup even though the host still has capacity.
    critical_points:
      - Cgroup limits are independent of host-wide free memory.
      - A container is still a host process under cgroup policy.
    objective_ids: [fpp:namespaces-cgroups/resource-control]
  - id: fpp:namespaces-cgroups/q-practice-transfer
    kind: scenario
    prompt: "Ordinary fair-scheduled processes A and B have different /proc/PID/ns/net link IDs, but /proc/PID/cgroup shows 0::/batch for both. On cgroup v2 with no configured quota burst, /batch/cpu.max is 50000 100000 and /batch/cpu.stat shows nr_throttled increasing during load. Does separate networking give each process an independent half-CPU budget?"
    model_answer: "No. Different network namespace IDs identify distinct networking views, while both processes are members of the same cgroup. Its aggregate CPU quota is 50 ms per 100 ms period, approximately half a CPU of bandwidth shared by the group, not a separate entitlement per process. The kernel enforces the quota and reports throttling. Compare membership and cpu.stat deltas; namespace links alone cannot establish resource limits, and an ancestor cgroup can impose a tighter effective constraint."
    critical_points:
      - "Network namespace identity and cgroup membership describe separate boundaries."
      - "A shared cgroup CPU quota applies to aggregate member use."
      - "Throttling deltas and ancestor constraints qualify the resource conclusion."
    objective_ids: [fpp:namespaces-cgroups/isolation, fpp:namespaces-cgroups/resource-control]
