schema_version: 1
unit_id: fpp:kubernetes-storage-lifecycle
revision: 5
visuals:
  - id: fpp:kubernetes-storage-lifecycle/visual-volume-lifecycle
    kind: lifecycle
    eyebrow: Storage lifecycle
    title: A claim becomes storage through provisioning, binding, and mount
    lines:
      - "no consumer + WaitForFirstConsumer → PVC Pending can be expected"
      - "consumer constraints → scheduler/storage coordination → zonal PV Bound"
      - "delete Pod only → PVC and data persist; replacement must fit topology"
      - "delete claim + Retain → PV Released → manual reclamation before reuse"
    teaching_point: Pod replacement does not imply volume mobility; access mode, storage topology, reclaim policy, and CSI capabilities determine what can be reattached and where.
