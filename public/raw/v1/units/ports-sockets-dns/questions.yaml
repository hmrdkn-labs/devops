schema_version: 1
unit_id: fpp:ports-sockets-dns
revision: 3
questions:
  - id: fpp:ports-sockets-dns/q-loopback
    kind: predict
    prompt: A web server listens on 127.0.0.1:8080. Can another pod or host connect to that listener directly?
    model_answer: No. The listener is bound to loopback inside its own network namespace. It must bind to a reachable interface address or be reached through an explicit proxy in that namespace.
    critical_points:
      - A port is scoped by address and network namespace.
      - Loopback is local to that namespace.
    objective_ids: [fpp:ports-sockets-dns/socket-endpoint]
  - id: fpp:ports-sockets-dns/q-dns
    kind: scenario
    prompt: DNS returns the expected IP, but TCP connections time out. What should you investigate next?
    model_answer: Inspect the route and packet path, network policy or firewall, whether a process listens on the destination address and port, and whether any load-balancer endpoints are healthy.
    critical_points:
      - Successful resolution does not prove transport reachability.
      - Test the next layer with evidence.
    objective_ids: [fpp:ports-sockets-dns/dns-resolution, fpp:ports-sockets-dns/socket-endpoint]
  - id: fpp:ports-sockets-dns/q-practice-transfer
    kind: scenario
    prompt: "In a normal Pod network namespace, DNS resolves reports.test to that Pod's 10.42.1.8 address. ss shows a TCP listener at 127.0.0.1:8080 owned by PID 33. A sidecar reaches localhost:8080 but a different Pod cannot reach 10.42.1.8:8080. Explain both observations and the next evidence before blaming DNS."
    model_answer: "The listener is bound only to loopback in the Pod's network namespace. Containers in the same Pod normally share that namespace, so the sidecar reaches it; a different Pod targets the Pod-interface address, which does not match the loopback-only listener. DNS returned an address but did not create a listener or forwarding path. Inspect ss in the target namespace and compare local probes to 127.0.0.1 and 10.42.1.8. Binding to an appropriate reachable address may repair the listener boundary, but policy and routing still need independent verification."
    critical_points:
      - "Loopback belongs to a network namespace; normal Pod containers share it."
      - "The requested destination address must match the listener binding."
      - "DNS success proves record resolution, not listener or packet-path correctness."
    objective_ids: [fpp:ports-sockets-dns/socket-endpoint, fpp:ports-sockets-dns/dns-resolution]
