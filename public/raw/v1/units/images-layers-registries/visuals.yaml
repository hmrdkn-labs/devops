visuals:
  - id: fpp:images-layers-registries/visual-image-supply-chain
    kind: lifecycle
    eyebrow: Image supply chain
    title: "Hidden in the final view, present in the image history"
    lines:
      - "layer 2 contains dummy private-config bytes"
      - "layer 3 removal → absent from final merged view"
      - "manifest still references layer 2 → bytes remain distributable"
      - "tag moves A → B; existing container stays based on A"
    teaching_point: "Merged-view deletion does not remove earlier-layer bytes. A mutable tag lookup and a running container are different states. Digest identity does not certify trusted content."
