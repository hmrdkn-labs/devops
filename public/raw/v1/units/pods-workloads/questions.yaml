schema_version: 1
unit_id: fpp:pods-workloads
revision: 2
questions:
  - id: fpp:pods-workloads/q-daemonset
    kind: scenario
    prompt: You need one log collector on every eligible worker node, including nodes added later. Which controller fits and why?
    model_answer: A DaemonSet. Its controller creates a matching Pod for each eligible node and responds as nodes join, leave, or change eligibility.
    critical_points:
      - Desired count derives from eligible nodes.
      - The use case is node-local infrastructure.
    objective_ids: [fpp:pods-workloads/controller-choice]
  - id: fpp:pods-workloads/q-share
    kind: explain
    prompt: What do two normal containers in the same Pod share, and what remains separate?
    model_answer: They share the Pod network namespace, IP, localhost, lifecycle placement, and declared shared volumes. They retain separate process identities, image filesystems, and resource settings unless explicitly configured otherwise.
    critical_points:
      - One Pod has one network identity.
      - Containers remain separate runtime processes.
    objective_ids: [fpp:pods-workloads/pod-boundary]
  - id: fpp:pods-workloads/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Classify four workloads before writing any manifest. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Describe identity, duration, placement, scaling, and replacement needs. Choose a controller for an API, database, node agent, and backup task. State one failure caused by choosing a different controller. Treat the conclusion as justified only when Every choice cites controller semantics rather than familiarity. Pod-level sharing is explicit for multi-container cases."
    critical_points:
      - "Every choice cites controller semantics rather than familiarity."
      - "Pod-level sharing is explicit for multi-container cases."
    objective_ids: [fpp:pods-workloads/pod-boundary, fpp:pods-workloads/controller-choice]
