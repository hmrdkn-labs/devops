schema_version: 1
unit_id: fpp:kcna-domain-map
revision: 3
questions:
  - id: fpp:kcna-domain-map/q-service
    kind: explain
    prompt: Why is the statement "a Kubernetes Service forwards traffic to Pods" useful shorthand but an incomplete mental model?
    model_answer: A Service object defines stable addressing and endpoint selection, while a data-plane implementation such as kube-proxy or an eBPF-based dataplane programs the actual forwarding behavior. The Service expresses intent and selection; another component executes packet handling.
    critical_points:
      - Separate the API object from the packet-forwarding executor.
      - Identify endpoint selection as distinct from forwarding.
    objective_ids: [fpp:kcna-domain-map/layers]
  - id: fpp:kcna-domain-map/q-weight
    kind: scenario
    prompt: You have limited KCNA study time. Why should Kubernetes Fundamentals receive more attention without ignoring Container Orchestration?
    model_answer: Kubernetes Fundamentals is 44% of the current exam, the largest domain, while Container Orchestration is still 28% and contains networking, security, troubleshooting, and storage that explain many real Kubernetes behaviors. Study time should roughly respect the weights while preserving prerequisites and cross-domain dependencies.
    critical_points:
      - Kubernetes Fundamentals is the largest current domain.
      - Exam weights guide emphasis but do not replace prerequisite order.
    objective_ids: [fpp:kcna-domain-map/domains]
  - id: fpp:kcna-domain-map/q-practice-transfer
    kind: scenario
    prompt: "Your practice results show that you can identify a Service manifest but cannot explain why a Ready Pod receives no request. You have ten study sessions left. Using current KCNA domain weights, propose an emphasis and trace a request to api:8080 that separates API intent, endpoint reconciliation and forwarding. What proof settles delivery?"
    model_answer: "Use the current 44/28/16/12 weights as an approximate emphasis for Fundamentals, Orchestration, Delivery and Architecture, while giving the observed networking gap focused practice rather than rigidly rounding sessions. A Service specifies stable addressing and selection, controllers record endpoint state, and the concrete kube-proxy/eBPF or other network implementation forwards traffic to the application. Inspect selectors, ready EndpointSlices and listener/port, then probe api:8080. Configuration or Ready status alone does not prove that request succeeded."
    critical_points:
      - "Current four-domain weights guide emphasis while evidence of a prerequisite gap changes practice."
      - "Service intent, endpoint reconciliation and packet execution differ; an actual request proves the exercised path."
    objective_ids: [fpp:kcna-domain-map/domains, fpp:kcna-domain-map/layers]
