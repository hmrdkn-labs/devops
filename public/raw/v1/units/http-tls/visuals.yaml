schema_version: 1
unit_id: fpp:http-tls
revision: 1
visuals:
  - id: fpp:http-tls/visual-request-stack
    kind: flow
    eyebrow: Request stack
    title: Identity is established before the HTTP exchange
    lines:
      - "hostname → DNS address → TCP connection → TLS certificate and hostname validation → HTTP request → HTTP response"
    teaching_point: TLS protects transport confidentiality and server identity, while HTTP separately carries methods, paths, headers, status codes, and application data.
