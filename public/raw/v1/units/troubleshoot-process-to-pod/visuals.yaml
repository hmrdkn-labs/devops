unit_id: fpp:troubleshoot-process-to-pod
revision: 4
visuals:
  - id: fpp:troubleshoot-process-to-pod/visual-evidence-ladder
    kind: evidence
    eyebrow: Evidence ladder
    title: "A healthy process can be absent from its Service"
    lines:
      - "checkout name → DNS → Service IP (discovery supported)"
      - "Service app=checkout ≠ Pod app=cart"
      - "endpoint controller → no matching Pod backend"
      - "direct Pod HTTP 200 ≠ Service-path proof"
      - "repair relationship → endpoint evidence → original client probe"
    teaching_point: "The observed selector-to-label mismatch localizes missing backend membership. Running/Ready and a direct Pod probe do not prove the Service path. Verification must repeat the original user-visible transaction after endpoint membership updates."
