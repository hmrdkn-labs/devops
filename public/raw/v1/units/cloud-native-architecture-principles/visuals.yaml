schema_version: 1
unit_id: fpp:cloud-native-architecture-principles
revision: 5
visuals:
  - id: fpp:cloud-native-architecture-principles/visual-system-loop
    kind: flow
    eyebrow: System model
    title: Cloud-native systems close the feedback loop
    lines:
      - "checkout v6 + replicas=3 → controller restores one lost instance"
      - "all replicas → one database → shared failure remains"
      - "night demand −90%, replicas still 3 → replication, no demonstrated contraction"
      - "transaction probe and demand/capacity history test different properties"
    teaching_point: Cloud-native architecture is defined by adaptable feedback loops and loose coupling, not merely by running software in a cloud.
  - id: fpp:cloud-native-architecture-principles/visual-scaling-owners
    kind: ownership
    eyebrow: Scaling control targets
    title: Replicas, resource sizing, and node capacity have different owners
    lines:
      - "HPA → workload desired replicas → controller creates Pods"
      - "VPA → recommendations/updates to Pod resource requests"
      - "unschedulable Pods → node autoscaler → suitable node capacity"
      - "scheduler assigns; kubelet executes; readiness + transaction test prove usable service"
    teaching_point: Desired scaling is not completed scaling; capacity, placement, execution and user outcomes need separate evidence.
