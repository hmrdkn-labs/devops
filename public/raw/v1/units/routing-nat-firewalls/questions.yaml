schema_version: 1
unit_id: fpp:routing-nat-firewalls
revision: 3
questions:
  - id: fpp:routing-nat-firewalls/q-nat
    kind: explain
    prompt: Why is NAT not the same control as a firewall?
    model_answer: NAT rewrites packet address or port fields and tracks the mapping. A firewall permits or denies traffic by policy. A device may perform both, but translation alone is not authorization.
    critical_points:
      - Translation changes packet identity.
      - Filtering decides permitted traffic.
    objective_ids: [fpp:routing-nat-firewalls/nat-policy]
  - id: fpp:routing-nat-firewalls/q-return
    kind: scenario
    prompt: Requests leave a pod and reach a server, but replies never return. Which direction and state must you inspect?
    model_answer: Trace the reverse route, return-policy state, and any SNAT mapping. The forward path can work while the response follows an asymmetric or filtered path.
    critical_points:
      - Validate both directions.
      - Include translation and connection tracking in the path.
    objective_ids: [fpp:routing-nat-firewalls/packet-path]
  - id: fpp:routing-nat-firewalls/q-practice-transfer
    kind: scenario
    prompt: "A gateway is configured to DNAT 203.0.113.10:443 to 10.0.2.9:8443. Its forwarding policy drops new TCP traffic to that translated backend port, and the backend otherwise has a valid return route. A client times out. Does the DNAT mapping prove the connection is authorized, and what evidence distinguishes translation from forwarding?"
    model_answer: "No. DNAT rewrites the destination under the configured NAT rule; forwarding policy separately decides whether the packet may pass. For this fixture, the drop rule prevents new traffic from reaching the backend despite a valid translation and return route. Compare the NAT rule's match counters, the forwarding drop counters and a backend-side capture or connection log in the same time window. Configuration alone proves a possible mapping, not that a live request used it. Linux hook order depends on packet origin and configured hook priorities."
    critical_points:
      - "DNAT changes address/port; it does not grant permission."
      - "Forwarding policy and reverse routing are separate boundaries."
      - "Same-window counters or captures establish observed execution; hook order is contextual."
    objective_ids: [fpp:routing-nat-firewalls/packet-path, fpp:routing-nat-firewalls/nat-policy]
