unit_id: fpp:shell-pipes-signals
revision: 3
visuals:
  - id: fpp:shell-pipes-signals/visual-process-composition
    kind: flow
    eyebrow: Shell process model
    title: "A successful compressor can conceal a failed export"
    lines:
      - "producer exits 7 → byte pipe → cat exits 0"
      - "Bash default pipeline status → 0 from last command"
      - "Bash pipefail → 7 from rightmost nonzero command"
      - "TERM → PID 1 → child only if forwarding/handling provides that path"
    teaching_point: "Pipeline bytes and pipeline exit-status selection are distinct. Without pipefail, the final command determines Bash pipeline status. Signal forwarding is a wrapper/process-tree responsibility, independent of pipefail."
