schema_version: 1
unit_id: fpp:ip-subnets
revision: 3
questions:
  - id: fpp:ip-subnets/q-local
    kind: predict
    prompt: A host has 10.20.4.17/24. Is 10.20.5.9 considered on-link from that interface?
    model_answer: No. With a /24 prefix, the connected network is 10.20.4.0/24. Traffic to 10.20.5.9 needs another matching route, commonly through a router.
    critical_points:
      - Compare the prefix, not the visual similarity of the address.
      - Non-local destinations require a route.
    objective_ids: [fpp:ip-subnets/address-prefix, fpp:ip-subnets/local-or-routed]
  - id: fpp:ip-subnets/q-pod
    kind: explain
    prompt: What does a unique pod IP buy Kubernetes beyond assigning only node IPs?
    model_answer: It gives each pod a directly addressable network identity, avoids host-port coordination for ordinary pod traffic, and supports a flat model where Services select changing pod endpoints.
    critical_points:
      - Pod identity is distinct from node identity.
      - Services remain stable while pod IPs change.
    objective_ids: [fpp:ip-subnets/address-prefix]
  - id: fpp:ip-subnets/q-practice-transfer
    kind: scenario
    prompt: "A Linux host has 10.20.4.17/24 on eth0. In one ordinary routing table it has 10.20.4.0/24 dev eth0, 10.20.4.128/25 via 10.20.4.1 dev eth0, and default via 10.20.4.254. For destination 10.20.4.200, which route wins and whose neighbor address should be resolved? Assume no policy routing or equal-cost ambiguity."
    model_answer: "The /25 wins because it matches more destination bits than the connected /24. The selected next hop is 10.20.4.1 on eth0, so the host resolves the router's link-layer address rather than directly resolving 10.20.4.200. The interface prefix alone does not override a more-specific route. ip route get 10.20.4.200 supplies lookup evidence, not proof that the router or destination responds."
    critical_points:
      - "The most-specific matching route wins under the stated table assumptions."
      - "An explicit next-hop route can override the broader connected prefix."
      - "A route lookup proves selection rather than end-to-end connectivity."
    objective_ids: [fpp:ip-subnets/address-prefix, fpp:ip-subnets/local-or-routed]
