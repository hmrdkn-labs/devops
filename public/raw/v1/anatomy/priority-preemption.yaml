slug: priority-preemption
title: "Priority and preemption: queue order is not a placement"
summary: A higher PriorityClass moves a Pod ahead in the scheduling queue and may nominate a node by evicting lower-priority Pods. The Pod is bound only after the victims are gone, and only if nothing better takes the room.
