title: "Pod networking underneath: the CNI plugin gives each Pod its address"
summary: Follow two Pods across two nodes from sandbox to address to Ready. The CNI plugin wires and addresses each Pod, kube-proxy forwards Service addresses only, and a NetworkPolicy changes traffic only where the installed CNI enforces it.
