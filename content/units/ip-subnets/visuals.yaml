visuals:
  - id: fpp:ip-subnets/visual-route-choice
    kind: flow
    eyebrow: Packet decision
    title: "A more-specific route overrides a connected prefix"
    lines:
      - "10.20.4.200 matches /24 and /25"
      - "/25 wins → next hop 10.20.4.1 via eth0"
      - "neighbor lookup targets gateway 10.20.4.1"
      - "10.20.4.30 → broader connected /24 → direct neighbor"
    teaching_point: "The most-specific matching route wins under the stated table assumptions. An explicit next-hop route can override the broader connected prefix. A route lookup proves selection rather than end-to-end connectivity."
