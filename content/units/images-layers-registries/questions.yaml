schema_version: 1
unit_id: fpp:images-layers-registries
revision: 3
questions:
  - id: fpp:images-layers-registries/q-delete
    kind: predict
    prompt: A secret is copied into one build layer and deleted in the next. Is it absent from the image's stored history?
    model_answer: No. The later deletion changes the final filesystem view, but the earlier layer still contains the bytes. Prevent the secret from entering any layer.
    critical_points:
      - Layers are immutable content objects.
      - Later deletion does not rewrite earlier content.
    objective_ids: [fpp:images-layers-registries/image-content]
  - id: fpp:images-layers-registries/q-digest
    kind: explain
    prompt: Why does deploying by digest improve reproducibility compared with deploying only by tag?
    model_answer: A digest identifies a specific manifest by content, while a registry tag can be moved to different content. Digest pinning removes that mutable lookup from the deployment.
    critical_points:
      - Tags are references that can change.
      - Digests are content-addressed identifiers.
    objective_ids: [fpp:images-layers-registries/tag-digest]
  - id: fpp:images-layers-registries/q-practice-transfer
    kind: scenario
    prompt: "An image adds a private build-config file in layer A and deletes it in layer B. Its tag api:demo later moves from digest A to digest B. A running container created from digest A keeps serving. Has deletion removed the private bytes from distributable image layers, and has retagging changed that running process?"
    model_answer: "No on both counts. A later removal hides the file from the merged filesystem but does not erase its content from the earlier layer. The registry tag is a mutable lookup to manifest content; changing it does not mutate an existing container's filesystem or process. Inspect the exact manifest and layer contents in a controlled fixture to assess included bytes, and compare the running container's image identity with the current tag resolution. Keep private input out of distributable layers; a digest identifies content, not trust or safety."
    critical_points:
      - "Merged-view deletion does not remove earlier-layer bytes."
      - "A mutable tag lookup and a running container are different states."
      - "Digest identity does not certify trusted content."
    objective_ids: [fpp:images-layers-registries/image-content, fpp:images-layers-registries/tag-digest]
