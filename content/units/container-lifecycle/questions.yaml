schema_version: 1
unit_id: fpp:container-lifecycle
revision: 3
questions:
  - id: fpp:container-lifecycle/q-exit
    kind: predict
    prompt: The main process exits successfully after completing a one-time task. What happens to the container?
    model_answer: The container enters a stopped or exited state with status zero. Whether another execution starts depends on an external restart policy or controller.
    critical_points:
      - Container lifetime follows its main process.
      - Restart is separate policy.
    objective_ids: [fpp:container-lifecycle/pid1-exit]
  - id: fpp:container-lifecycle/q-restart
    kind: explain
    prompt: Why is a restarted container a new process execution rather than a continuation?
    model_answer: The previous process and its memory ended. The runtime starts the configured command again using image content, retained configuration, and any external storage.
    critical_points:
      - Process memory is not resumed.
      - Durable state must live outside the process.
    objective_ids: [fpp:container-lifecycle/create-start-stop]
  - id: fpp:container-lifecycle/q-practice-transfer
    kind: scenario
    prompt: "A Docker container writes /tmp/run-marker in its writable layer and builds an in-memory cache. Its main process exits 2. An operator starts the same stopped container, then later removes it and creates a new one from the same image without mounts. Predict marker and cache state at each restart boundary. Is exit 2 alone enough to diagnose the cause?"
    model_answer: "Starting the same container retains its writable layer, so the marker remains, but the new process has no old in-memory cache. Removing that container and creating another produces a new writable layer, so a marker absent from the image is lost without external storage. Docker/runtime lifecycle owns process execution and container state; image input remains separate. Inspect container identity, state/exit code, logs and mount configuration. Exit 2 is evidence of termination status, not a universal root-cause label."
    critical_points:
      - "Same-container start retains writable-layer state but not process memory."
      - "Removal and recreation replace the writable layer unless data is externalized."
      - "An exit code must be interpreted with application and runtime evidence."
    objective_ids: [fpp:container-lifecycle/create-start-stop, fpp:container-lifecycle/pid1-exit]
