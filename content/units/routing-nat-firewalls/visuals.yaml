  - id: fpp:routing-nat-firewalls/visual-packet-policy
    kind: flow
    eyebrow: Packet path
    title: "A published mapping can still be filtered"
    lines:
      - "client → 203.0.113.10:443"
      - "gateway DNAT mapping → 10.0.2.9:8443"
      - "gateway forwarding policy → NEW connection dropped"
      - "NAT counter + drop counter + backend observation → locate boundary"
    teaching_point: "DNAT changes address/port; it does not grant permission. Forwarding policy and reverse routing are separate boundaries. Same-window counters or captures establish observed execution; hook order is contextual."
