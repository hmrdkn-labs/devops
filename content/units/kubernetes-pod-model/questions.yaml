schema_version: 1
unit_id: fpp:kubernetes-pod-model
revision: 2
questions:
  - id: fpp:kubernetes-pod-model/q-delete
    kind: predict
    prompt: A Deployment has three healthy Pods. You delete one Pod manually. Who replaces it, and what changes about the replacement?
    model_answer: The ReplicaSet controller detects that the number of matching Pods fell below its desired replica count and creates a new Pod. The replacement is a new Pod object with a new UID and potentially a different node and Pod IP.
    critical_points:
      - ReplicaSet reconciles the replica count.
      - Replacement creates a new Pod identity rather than reviving the deleted Pod.
    objective_ids: [fpp:kubernetes-pod-model/ownership]
  - id: fpp:kubernetes-pod-model/q-running
    kind: scenario
    prompt: A Pod shows phase Running, but the application is unusable and the restart count keeps increasing. Why is that not contradictory?
    model_answer: Pod phase is a coarse lifecycle summary. A Pod can remain Running while one container repeatedly exits and the kubelet restarts it. Inspect container state, last termination reason, restart count, conditions, events, and logs for the actual failure.
    critical_points:
      - Pod phase is not a complete health signal.
      - Container restart can occur inside the same Pod identity.
    objective_ids: [fpp:kubernetes-pod-model/lifecycle]
  - id: fpp:kubernetes-pod-model/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Use any disposable test cluster with a three-replica Deployment and trace one manual Pod deletion. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Record the Deployment, ReplicaSet, and three Pod names and UIDs. Delete one Pod and watch Pods and ReplicaSets change. Compare the deleted and replacement Pod UID, node, and IP, then inspect owner references. Treat the conclusion as justified only when The replacement is identified as a new Pod object. The ReplicaSet is named as the direct replica-count owner."
    critical_points:
      - "The replacement is identified as a new Pod object."
      - "The ReplicaSet is named as the direct replica-count owner."
    objective_ids: [fpp:kubernetes-pod-model/lifecycle, fpp:kubernetes-pod-model/ownership]
