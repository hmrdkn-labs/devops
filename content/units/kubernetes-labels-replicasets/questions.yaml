schema_version: 1
unit_id: fpp:kubernetes-labels-replicasets
revision: 3
questions:
  - id: fpp:kubernetes-labels-replicasets/q-delete
    kind: predict
    prompt: A ReplicaSet wants three Pods with app=web. You delete one matching Pod but do not change the ReplicaSet. What should happen next and why?
    model_answer: The ReplicaSet controller observes only two matching Pods while the desired count remains three, so it creates a new Pod from the template to restore the selected set to three.
    critical_points:
      - Desired replica count did not change.
      - The controller reconciles the selected live set back to desired count.
    objective_ids: [fpp:kubernetes-labels-replicasets/reconciliation]
  - id: fpp:kubernetes-labels-replicasets/q-label
    kind: explain
    prompt: Why is a ReplicaSet selector more important than a convenient kubectl filtering expression?
    model_answer: The selector defines which Pods count as members of the ReplicaSet's controlled set. Reconciliation, possible adoption, scale decisions, and ownership behavior depend on that membership rule.
    critical_points:
      - Selector defines controller membership.
      - Template labels must produce Pods that satisfy the selector.
    objective_ids: [fpp:kubernetes-labels-replicasets/selection]
  - id: fpp:kubernetes-labels-replicasets/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Inspect one controller-managed ReplicaSet and connect its selector to the Pods that count toward desired replicas. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Record desired replicas, selector, and Pod-template labels from the ReplicaSet. List Pods using the same selector and compare actual count with desired count. Inspect one Pod owner reference and predict what happens if that Pod is deleted. Treat the conclusion as justified only when The selected set is derived from labels rather than Pod names. The prediction identifies the ReplicaSet control loop."
    critical_points:
      - "The selected set is derived from labels rather than Pod names."
      - "The prediction identifies the ReplicaSet control loop."
    objective_ids: [fpp:kubernetes-labels-replicasets/selection, fpp:kubernetes-labels-replicasets/reconciliation]
  - id: fpp:kubernetes-labels-replicasets/q-template-selector
    kind: predict
    prompt: A ReplicaSet selector requires app=web, but its Pod template labels only contain app=api. Should that controller definition be accepted as a coherent ReplicaSet?
    model_answer: No. The ReplicaSet template must produce Pods that satisfy its selector. Otherwise the controller would create Pods that do not belong to the set it is supposed to reconcile, so the API validates that relationship.
    critical_points:
      - The selector defines membership in the controlled set.
      - Template labels must satisfy the selector used by the ReplicaSet.
    objective_ids: [fpp:kubernetes-labels-replicasets/selection]
  - id: fpp:kubernetes-labels-replicasets/q-adoption
    kind: scenario
    prompt: An otherwise unmanaged Pod is relabeled so that it matches an existing ReplicaSet selector. Why can that be dangerous to treat as a harmless metadata change?
    model_answer: A matching unmanaged Pod can become part of the ReplicaSet's selected population and may be adopted when eligible. That changes replica accounting and can put the Pod under controller ownership, so selector labels carry control semantics rather than being decorative tags.
    critical_points:
      - Matching labels can change controller membership and replica accounting.
      - Labels used by selectors are part of the control relationship.
    objective_ids: [fpp:kubernetes-labels-replicasets/selection, fpp:kubernetes-labels-replicasets/reconciliation]
