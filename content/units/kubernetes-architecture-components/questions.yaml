schema_version: 1
unit_id: fpp:kubernetes-architecture-components
revision: 3
questions:
  - id: fpp:kubernetes-architecture-components/q-scheduler
    kind: predict
    prompt: The scheduler is unavailable for several minutes while existing Pods are healthy. What should you expect for existing Pods and newly created unscheduled Pods?
    model_answer: Existing Pods can continue running on their nodes because the scheduler is not their runtime executor. Newly created Pods that need placement can remain Pending until a scheduler chooses nodes for them.
    critical_points:
      - Scheduler selects placement rather than running containers.
      - Existing runtime execution can continue during a scheduler outage.
    objective_ids: [fpp:kubernetes-architecture-components/roles]
  - id: fpp:kubernetes-architecture-components/q-apply
    kind: explain
    prompt: After the API server accepts a new Deployment, which components are responsible for turning that intent into running containers?
    model_answer: A Deployment controller reconciles the Deployment into a ReplicaSet, the ReplicaSet controller creates Pods, the scheduler selects nodes for unscheduled Pods, and the kubelet on each chosen node asks the container runtime to start the containers and reports status back through the API.
    critical_points:
      - Controllers create/reconcile API objects.
      - Scheduler chooses nodes and kubelet/runtime execute on those nodes.
    objective_ids: [fpp:kubernetes-architecture-components/request-path]
  - id: fpp:kubernetes-architecture-components/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: In a disposable cluster, create or reuse one Deployment and collect evidence at each ownership boundary. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Record the Deployment and ReplicaSet owner relationship. Record one Pod owner reference and assigned node. Inspect Pod events to identify scheduling and container-start transitions. Compare API status with one real request to the running workload. Treat the conclusion as justified only when Deployment, ReplicaSet, scheduler placement, kubelet/runtime execution, and request proof are described as separate boundaries. The final proof is stronger than merely showing that the manifest exists."
    critical_points:
      - "Deployment, ReplicaSet, scheduler placement, kubelet/runtime execution, and request proof are described as separate boundaries."
      - "The final proof is stronger than merely showing that the manifest exists."
    objective_ids: [fpp:kubernetes-architecture-components/roles, fpp:kubernetes-architecture-components/request-path]
  - id: fpp:kubernetes-architecture-components/q-node-boundary
    kind: scenario
    prompt: A Pod has a nodeName assigned, but its container is still Waiting and has never started. Which component has already completed its main decision, and which components now own the next execution boundary?
    model_answer: The scheduler has already made the placement decision. The kubelet on the chosen node must now realize the Pod, using the container runtime and required node integrations such as image, network, and volume setup. Pod events and container state are the next evidence.
    critical_points:
      - nodeName is evidence that scheduling has occurred.
      - kubelet and the runtime own node-side realization after placement.
    objective_ids: [fpp:kubernetes-architecture-components/roles, fpp:kubernetes-architecture-components/request-path]
  - id: fpp:kubernetes-architecture-components/q-etcd-outage
    kind: predict
    prompt: If etcd becomes unavailable while worker-node processes are still healthy, should all running application containers immediately stop? What part of the system is primarily impaired?
    model_answer: Running containers do not automatically stop just because etcd is unavailable. The control plane loses reliable access to durable cluster state, so API reads or writes that depend on that state and subsequent reconciliation are impaired, while already-running node processes may continue temporarily.
    critical_points:
      - etcd stores durable control-plane state rather than executing containers.
      - Control-plane state availability and existing node execution are separate failure boundaries.
    objective_ids: [fpp:kubernetes-architecture-components/roles]
