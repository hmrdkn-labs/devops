schema_version: 1
unit_id: fpp:kubernetes-architecture-components
revision: 2
visuals:
  - id: fpp:kubernetes-architecture-components/visual-request-path
    kind: ownership
    eyebrow: API request path
    title: A workload change crosses control-plane and node responsibilities
    lines:
      - "kubectl → kube-apiserver: submit desired state"
      - "kube-apiserver ↔ etcd: persist API state"
      - "Deployment controller ↔ kube-apiserver: observe Deployment, write ReplicaSet"
      - "ReplicaSet controller ↔ kube-apiserver: observe ReplicaSet, create Pod"
      - "kube-scheduler ↔ kube-apiserver: observe unscheduled Pod, write binding"
      - "kubelet ↔ kube-apiserver: observe assigned Pod, report status"
      - "kubelet → container runtime: create and run containers"
    teaching_point: "Follow one change end to end, but keep the boundaries precise: controllers, scheduler, and kubelet coordinate through the API server; the API server persists state in etcd; kubelet asks the container runtime to execute containers."
    components:
      - name: kubectl
        location: client
        responsibility: Builds and sends Kubernetes API requests from the operator or automation context.
        acts_on: Kubernetes API objects
        proof: kubectl -v=8 get pods
      - name: kube-apiserver
        location: control-plane
        responsibility: Authenticates, authorizes, validates, and exposes the shared Kubernetes API state.
        acts_on: API requests and persisted object state
        proof: kubectl get --raw=/readyz
      - name: etcd
        location: control-plane
        responsibility: Persists the strongly consistent control-plane state used by the Kubernetes API.
        acts_on: Serialized cluster state behind the API server
        proof: etcdctl endpoint status
      - name: Deployment controller (kube-controller-manager)
        location: control-plane
        responsibility: Reconciles Deployment rollout intent by creating and scaling ReplicaSets.
        acts_on: Deployment and ReplicaSet API objects
        proof: kubectl describe deployment <name>
      - name: ReplicaSet controller (kube-controller-manager)
        location: control-plane
        responsibility: Reconciles the desired number of matching Pods for a ReplicaSet.
        acts_on: ReplicaSet and Pod API objects
        proof: kubectl describe rs <name>
      - name: kube-scheduler
        location: control-plane
        responsibility: Chooses a feasible node for an unscheduled Pod and records that placement decision.
        acts_on: Unscheduled Pod objects
        proof: kubectl get pod <name> -o wide
      - name: kubelet
        location: worker-node
        responsibility: Reconciles assigned Pod specifications into running node-local container workloads and reports status.
        acts_on: Pods assigned to its node
        proof: kubectl describe pod <name>
      - name: container runtime
        location: worker-node
        responsibility: Pulls images and creates, starts, stops, and removes containers when asked through the runtime interface.
        acts_on: Pod sandboxes and containers
        proof: crictl ps
