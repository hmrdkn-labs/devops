visuals:
  - id: fpp:container-network-storage/visual-boundaries
    kind: ownership
    eyebrow: Isolation boundary
    title: Cross the container boundary explicitly
    lines:
      - "client → host published port → container interface → listening process"
      - "container path → writable layer or bind mount or managed volume → persistent bytes"
    teaching_point: Network reachability and durable data do not appear automatically across container isolation; explicit port and storage mappings create those crossings.
