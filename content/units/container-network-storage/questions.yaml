schema_version: 1
unit_id: fpp:container-network-storage
revision: 3
questions:
  - id: fpp:container-network-storage/q-port
    kind: explain
    prompt: Why does a process listening on port 8080 inside a container not necessarily expose host port 8080?
    model_answer: The process listens in the container network namespace. Host reachability requires routing to the container address or an explicit publication rule or proxy on a host endpoint.
    critical_points:
      - Ports are scoped to an address and namespace.
      - Publication creates a separate forwarding path.
    objective_ids: [fpp:container-network-storage/network-boundary]
  - id: fpp:container-network-storage/q-data
    kind: predict
    prompt: A container is removed and recreated from the same image. Which data survives automatically?
    model_answer: Image content survives because it is separate and immutable. Writable-layer data does not; only data placed in an external volume, bind mount, or service survives by design.
    critical_points:
      - Writable layers belong to a container instance.
      - Persistence must be explicit.
    objective_ids: [fpp:container-network-storage/storage-boundary]
  - id: fpp:container-network-storage/q-practice-transfer
    kind: scenario
    prompt: "A Linux Docker bridge container serves 0.0.0.0:8080, publishes 127.0.0.1:18080:8080, mounts named volume notes at /data, and writes a marker both to /data and /tmp. It is removed without removing notes and recreated with the same mappings. Which client endpoint is intentionally published, and which marker survives? Assume Docker Engine 28+ default bridge publication behavior."
    model_answer: "The published host endpoint is loopback TCP port 18080, forwarded to the container's port 8080; it is not an intentional remote-host publication. The Docker data plane executes the forwarding, while the app's listener belongs to the container network namespace. The /data marker survives in named volume notes; the /tmp marker in the removed writable layer does not. Inspect port bindings, mount identity and markers in the replacement. Same-container restart would retain the writable marker, and publication scope does not eliminate independent routed or privileged access paths."
    critical_points:
      - "Host publication and container listener are separate endpoints."
      - "A retained named volume survives removal/recreation; the writable layer does not."
      - "Loopback publication describes a scoped path, not all possible access routes."
    objective_ids: [fpp:container-network-storage/network-boundary, fpp:container-network-storage/storage-boundary]
