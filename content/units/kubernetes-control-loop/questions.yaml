schema_version: 1
unit_id: fpp:kubernetes-control-loop
revision: 3
questions:
  - id: fpp:kubernetes-control-loop/q-delete
    kind: predict
    prompt: You delete one Pod owned by a Deployment whose desired replica count remains three. What should happen?
    model_answer: The Deployment and ReplicaSet controllers observe a replica shortfall and create a replacement Pod. The scheduler and kubelet then realize it on a suitable node.
    critical_points:
      - Desired state remains three.
      - Controllers recreate disposable children.
    objective_ids: [fpp:kubernetes-control-loop/reconciliation]
  - id: fpp:kubernetes-control-loop/q-eks-kubectl
    kind: explain
    prompt: Is kubectl fundamentally different on EKS than on a self-managed Kubernetes cluster?
    model_answer: Its Kubernetes operations are the same API requests. EKS commonly adds an AWS credential and token-generation step to build kubeconfig and authenticate to a different API server, with AWS-integrated authorization.
    critical_points:
      - kubectl remains a Kubernetes API client.
      - Authentication setup and API-server ownership differ.
    objective_ids: [fpp:kubernetes-control-loop/api-state]
  - id: fpp:kubernetes-control-loop/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Inspect a disposable Deployment and trace desired state to a running process. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Create a small Deployment in an isolated namespace. Follow owner references from Pod to ReplicaSet to Deployment. Delete one Pod and watch the replacement events. Treat the conclusion as justified only when You can name the controller responsible for replacement. You can separate API object creation from node realization."
    critical_points:
      - "You can name the controller responsible for replacement."
      - "You can separate API object creation from node realization."
    objective_ids: [fpp:kubernetes-control-loop/api-state, fpp:kubernetes-control-loop/reconciliation]
  - id: fpp:kubernetes-control-loop/q-controller-outage
    kind: predict
    prompt: The controller manager is unavailable for several minutes while existing Pods keep running. What continues to work, and what kind of behavior should stop converging?
    model_answer: Existing containers can keep running because kubelets and runtimes execute them on nodes. Controller-owned drift such as a missing ReplicaSet Pod will not be repaired until the relevant controller is running again, even though the desired state remains stored through the API.
    critical_points:
      - Controllers reconcile state; they do not execute already-running containers.
      - Desired state can persist while reconciliation is temporarily stalled.
    objective_ids: [fpp:kubernetes-control-loop/api-state, fpp:kubernetes-control-loop/reconciliation]
  - id: fpp:kubernetes-control-loop/q-unscheduled-pod
    kind: scenario
    prompt: A Pod object exists in the API, remains Pending, and has no nodeName. Which control-loop boundary has already succeeded, which component should act next, and what evidence would you inspect?
    model_answer: API creation has succeeded, but placement has not. The scheduler should select a feasible node and record the binding through the API. Inspect Pod scheduling conditions and events before investigating kubelet or container-runtime execution.
    critical_points:
      - Object creation and node placement are separate stages.
      - A Pod without nodeName has not yet reached the kubelet execution boundary.
    objective_ids: [fpp:kubernetes-control-loop/api-state, fpp:kubernetes-control-loop/reconciliation]
