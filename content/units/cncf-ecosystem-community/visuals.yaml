    eyebrow: Ecosystem model
    title: Choose projects around open responsibilities and interfaces
    lines:
      - "platform requirement → choose implementation; Landscape is a catalog"
      - "kubelet → CRI contract → runtime executes containers"
      - "CNI integration → plugin configures network → concrete dataplane handles packets"
