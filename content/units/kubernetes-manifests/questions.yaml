schema_version: 1
unit_id: fpp:kubernetes-manifests
revision: 4
questions:
  - id: fpp:kubernetes-manifests/q-apply-proof
    kind: scenario
    prompt: kubectl apply reports that a Deployment was configured, but the application is unavailable. What has been proven, and what still needs evidence?
    model_answer: The successful apply proves the API accepted the requested object update. It does not prove reconciliation succeeded. Verify the live Deployment and ReplicaSet state, Pod scheduling and readiness, events, logs, Service endpoints, and finally an application request as needed.
    critical_points:
      - API acceptance is not workload success.
      - Follow the control loop and collect downstream evidence.
    objective_ids: [fpp:kubernetes-manifests/proof-boundary]
  - id: fpp:kubernetes-manifests/q-spec-status
    kind: explain
    prompt: Why is the distinction between spec and status useful when troubleshooting a Kubernetes object?
    model_answer: Spec expresses the desired state the user or controller requested, while status reports what Kubernetes has observed. Comparing them exposes whether reconciliation has converged or where desired and observed state still differ.
    critical_points:
      - Spec is intent.
      - Status is observed state and convergence evidence.
    objective_ids: [fpp:kubernetes-manifests/object-shape]
  - id: fpp:kubernetes-manifests/q-practice-transfer
    kind: scenario
    prompt: "A proposed apps/v1 Deployment has selector.matchLabels app=web, but template.metadata.labels app=api. Assume no object with that name exists. Does it reach scheduler filtering? What result would distinguish API validation failure from an unscheduled Pod?"
    model_answer: "The Deployment is invalid because its selector does not match its Pod-template labels. The API rejects creation before this Deployment can produce Pods. Inspect the create error and query the Deployment by name: no new object is stored. Scheduler FailedScheduling applies to an accepted Pod waiting for placement, not this rejected manifest."
    critical_points:
      - "Deployment selector must match template labels."
      - "API rejection precedes controller and scheduler work."
    objective_ids: [fpp:kubernetes-manifests/object-shape, fpp:kubernetes-manifests/proof-boundary]

  - id: fpp:kubernetes-manifests/q-missing-api-version
    kind: predict
    prompt: A document is syntactically valid YAML and contains kind, metadata, and spec, but apiVersion is missing. Should Kubernetes treat it as a valid API object?
    model_answer: No. YAML syntax can still be valid, but a Kubernetes object needs apiVersion and kind so the API server can identify the resource schema and endpoint. Serialization success alone does not establish a valid Kubernetes request.
    critical_points:
      - apiVersion and kind identify the Kubernetes API type.
      - YAML validity and Kubernetes object validity are separate claims.
    objective_ids: [fpp:kubernetes-manifests/object-shape]
  - id: fpp:kubernetes-manifests/q-object-fields
    kind: scenario
    prompt: You inspect a Deployment where spec.replicas is 4 but status.availableReplicas is 2. What should you infer before changing anything?
    model_answer: The desired state asks for four replicas while the observed available state has only two, so reconciliation has not fully converged. Inspect status conditions, ReplicaSets, Pods, events, scheduling, and readiness to locate the gap instead of editing the manifest immediately.
    critical_points:
      - spec expresses requested intent while status reports observation.
      - A spec/status gap is evidence to investigate, not itself the root cause.
    objective_ids: [fpp:kubernetes-manifests/object-shape, fpp:kubernetes-manifests/proof-boundary]
