schema_version: 1
unit_id: fpp:shell-pipes-signals
revision: 3
questions:
  - id: fpp:shell-pipes-signals/q-pipe
    kind: explain
    prompt: What exactly travels between two commands joined by a pipe, and what does not?
    model_answer: Bytes written to the first process's standard output become bytes on the second process's standard input. Standard error is separate unless redirected, and the pipe carries no semantic knowledge of records.
    critical_points:
      - A pipe connects file descriptors.
      - Standard error is not piped by default.
    objective_ids: [fpp:shell-pipes-signals/stream-composition]
  - id: fpp:shell-pipes-signals/q-term
    kind: scenario
    prompt: Kubernetes sends SIGTERM, but the app keeps running until it is killed. Name two likely causes.
    model_answer: The application may not handle SIGTERM, or a PID 1 wrapper may not forward it. The graceful termination window may also be shorter than the application's drain time.
    critical_points:
      - SIGTERM is cooperative.
      - The signal must reach the intended process.
    objective_ids: [fpp:shell-pipes-signals/signal-shutdown]
  - id: fpp:shell-pipes-signals/q-practice-transfer
    kind: scenario
    prompt: "A container uses a Bash wrapper running bash -c 'exporter | gzip'. exporter exits 7 and gzip exits 0; pipefail is off. On a later execution, the runtime sends TERM to wrapper PID 1 while its pipeline is active. What did the earlier zero pipeline status actually prove, and does it establish that the later exporter received TERM?"
    model_answer: "With pipefail off, the pipeline status is the last command's status, so zero reports gzip's success, not the exporter's success. Bash pipefail would expose the earlier nonzero failure; it changes status selection, not signal forwarding. A TERM sent to PID 1 is a separate kernel signal delivery boundary. Inspect the process tree and wrapper signal-handling behavior to establish whether a live child receives it; neither a pipe nor an exit status proves forwarding."
    critical_points:
      - "Pipeline bytes and pipeline exit-status selection are distinct."
      - "Without pipefail, the final command determines Bash pipeline status."
      - "Signal forwarding is a wrapper/process-tree responsibility, independent of pipefail."
    objective_ids: [fpp:shell-pipes-signals/stream-composition, fpp:shell-pipes-signals/signal-shutdown]
