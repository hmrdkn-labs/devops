schema_version: 1
unit_id: fpp:kubernetes-scheduling-placement
revision: 2
questions:
  - id: fpp:kubernetes-scheduling-placement/q-low-usage
    kind: scenario
    prompt: A node is using only 20% CPU in a monitoring dashboard, but a new Pod is rejected for insufficient CPU. How can both observations be true?
    model_answer: Scheduling is based on allocatable capacity and declared Pod requests, not only current utilization. Existing Pods may already reserve most schedulable CPU through requests even while their instantaneous CPU usage is low.
    critical_points:
      - Resource requests drive scheduling feasibility.
      - Current utilization and committed requested capacity are different measurements.
    objective_ids: [fpp:kubernetes-scheduling-placement/feasibility]
  - id: fpp:kubernetes-scheduling-placement/q-toleration
    kind: explain
    prompt: Does adding a toleration for a tainted GPU node guarantee that the Pod will be scheduled onto that GPU node?
    model_answer: No. The toleration only removes the matching taint as a reason to reject the Pod. Other nodes may still be feasible, and explicit node selection or affinity plus resource requirements may be needed to express where the Pod should run.
    critical_points:
      - Toleration permits eligibility; it does not force placement.
      - Other constraints and scheduler scoring still apply.
    objective_ids: [fpp:kubernetes-scheduling-placement/policy]
  - id: fpp:kubernetes-scheduling-placement/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Use a disposable cluster with at least two nodes or reason from a recorded node inventory and one hypothetical Pod specification. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Record node labels, taints, and allocatable CPU and memory. Write the Pod's requests and hard placement requirements. Eliminate every node that fails one hard condition and explain why. Compare the predicted feasible set with scheduler events or the actual assigned node. Treat the conclusion as justified only when Resource requests and hard constraints are evaluated before preferences. A toleration is not described as a force-placement rule."
    critical_points:
      - "Resource requests and hard constraints are evaluated before preferences."
      - "A toleration is not described as a force-placement rule."
    objective_ids: [fpp:kubernetes-scheduling-placement/feasibility, fpp:kubernetes-scheduling-placement/policy]
