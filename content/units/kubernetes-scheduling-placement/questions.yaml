schema_version: 1
unit_id: fpp:kubernetes-scheduling-placement
revision: 4
questions:
  - id: fpp:kubernetes-scheduling-placement/q-low-usage
    kind: scenario
    prompt: A node is using only 20% CPU in a monitoring dashboard, but a new Pod is rejected for insufficient CPU. How can both observations be true?
    model_answer: Scheduling is based on allocatable capacity and declared Pod requests, not only current utilization. Existing Pods may already reserve most schedulable CPU through requests even while their instantaneous CPU usage is low.
    critical_points:
      - Resource requests drive scheduling feasibility.
      - Current utilization and committed requested capacity are different measurements.
    objective_ids: [fpp:kubernetes-scheduling-placement/feasibility]
  - id: fpp:kubernetes-scheduling-placement/q-toleration
    kind: explain
    prompt: Does adding a toleration for a tainted GPU node guarantee that the Pod will be scheduled onto that GPU node?
    model_answer: No. The toleration only removes the matching taint as a reason to reject the Pod. Other nodes may still be feasible, and explicit node selection or affinity plus resource requirements may be needed to express where the Pod should run.
    critical_points:
      - Toleration permits eligibility; it does not force placement.
      - Other constraints and scheduler scoring still apply.
    objective_ids: [fpp:kubernetes-scheduling-placement/policy]
  - id: fpp:kubernetes-scheduling-placement/q-practice-transfer
    kind: scenario
    prompt: "A Pod requests 600m CPU and requires zone=east. Node A is east with 500m uncommitted allocatable CPU; Node B is west with 1500m; Node C is east with 900m but has dedicated=gpu:NoSchedule, which the Pod does not tolerate. A preference favors Node B. Which nodes survive filtering, and what evidence would test this prediction?"
    model_answer: "None. A fails CPU fit, B fails required zone selection, and C fails the untolerated NoSchedule taint. A preference cannot rescue an infeasible node. Inspect the live Pod requests/selector/tolerations, node labels/taints and allocated requests, then FailedScheduling events. Instantaneous CPU utilization does not replace requested-capacity accounting."
    critical_points:
      - "All three nodes fail a hard constraint."
      - "Scoring preferences apply only to feasible nodes."
    objective_ids: [fpp:kubernetes-scheduling-placement/feasibility, fpp:kubernetes-scheduling-placement/policy]

  - id: fpp:kubernetes-scheduling-placement/q-hard-vs-soft-affinity
    kind: explain
    prompt: What is the practical difference between requiredDuringSchedulingIgnoredDuringExecution and preferredDuringSchedulingIgnoredDuringExecution node affinity?
    model_answer: "Required affinity is a hard feasibility rule: nodes that do not match are excluded. Preferred affinity is a scoring preference among otherwise feasible nodes, so the scheduler may choose a nonpreferred node when necessary."
    critical_points:
      - Required affinity filters feasible nodes.
      - Preferred affinity influences scoring but does not guarantee placement.
    objective_ids: [fpp:kubernetes-scheduling-placement/policy]
  - id: fpp:kubernetes-scheduling-placement/q-topology-spread
    kind: scenario
    prompt: You want replicas distributed across zones to reduce correlated failure. Why is a topology spread constraint a better expression of that goal than simply adding a toleration for nodes in each zone?
    model_answer: A topology spread constraint expresses the desired distribution of matching Pods across topology domains such as zones. Tolerations only allow Pods onto nodes with matching taints; they do not balance replicas across zones or express skew.
    critical_points:
      - Topology spread expresses replica distribution across domains.
      - Tolerations remove taint rejection but do not balance placement.
    objective_ids: [fpp:kubernetes-scheduling-placement/policy, fpp:kubernetes-scheduling-placement/feasibility]
