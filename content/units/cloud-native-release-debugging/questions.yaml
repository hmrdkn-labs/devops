schema_version: 1
unit_id: fpp:cloud-native-release-debugging
revision: 3
questions:
  - id: fpp:cloud-native-release-debugging/q-canary
    kind: explain
    prompt: Why is running one Pod with the new version not enough by itself to call a release a canary?
    model_answer: Canary delivery requires controlled exposure of a subset of traffic or users plus observation criteria that decide whether to expand or abort. One new Pod without known traffic allocation and measured outcomes is merely a mixed-version workload.
    critical_points:
      - Canary is defined by controlled traffic exposure and measurement.
      - The traffic-routing executor must be identified.
    objective_ids: [fpp:cloud-native-release-debugging/strategy]
  - id: fpp:cloud-native-release-debugging/q-ready
    kind: scenario
    prompt: New Pods are Running but never appear in the Service EndpointSlice as ready backends. What should you investigate before blaming the Service dataplane?
    model_answer: Inspect the Pods' readiness probes and conditions, application listener/port, startup state, and Service selector. A Running Pod can still be unready and therefore excluded from ready Service endpoints.
    critical_points:
      - Running is not the same as ready for traffic.
      - Endpoint eligibility should be proved before debugging packet forwarding.
    objective_ids: [fpp:cloud-native-release-debugging/evidence]
  - id: fpp:cloud-native-release-debugging/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Use a disposable Deployment or a recorded incident and build a proof ledger from artifact identity to user request. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Verify the desired image digest or tag for the target revision. Inspect rollout status, ReplicaSets, and Pod events. Inspect container state and current/previous logs if a restart occurred. Verify readiness and EndpointSlice membership. Make the same request a user or upstream service would make. Treat the conclusion as justified only when The first broken boundary is named before a fix is proposed. Running, Ready, endpoint membership, and successful request are treated as different evidence."
    critical_points:
      - "The first broken boundary is named before a fix is proposed."
      - "Running, Ready, endpoint membership, and successful request are treated as different evidence."
    objective_ids: [fpp:cloud-native-release-debugging/strategy, fpp:cloud-native-release-debugging/evidence]
  - id: fpp:cloud-native-release-debugging/q-blue-green
    kind: scenario
    prompt: What makes a release blue-green rather than merely two Deployments with different versions running at the same time?
    model_answer: Blue-green requires two complete environments or workload sets plus an explicit traffic switch from the old version to the new one, with a rollback path by switching traffic back. Merely running both versions does not define which users reach which version.
    critical_points:
      - Blue-green is defined by an explicit traffic cutover boundary.
      - Parallel versions alone do not specify rollout semantics.
    objective_ids: [fpp:cloud-native-release-debugging/strategy]
  - id: fpp:cloud-native-release-debugging/q-image-proof
    kind: scenario
    prompt: A rollout claims success, but you suspect some Pods are running the wrong application build. What evidence would distinguish desired image configuration from the artifact actually running?
    model_answer: Inspect the Deployment and Pod specs for the desired image reference, then verify the resolved image ID or digest on the running containers. A mutable tag can point to different artifacts over time, so artifact identity should be proved with the runtime-resolved image information rather than the tag string alone.
    critical_points:
      - Desired image reference and resolved runtime artifact are different evidence.
      - Immutable digest or image ID is stronger proof than a mutable tag.
    objective_ids: [fpp:cloud-native-release-debugging/evidence]
