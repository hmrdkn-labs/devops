  - id: fpp:pods-workloads/visual-controller-choice
    kind: ownership
    eyebrow: Workload ownership
    title: Choose the controller from the lifecycle semantics you need
    lines:
      - "02:00 schedule → CronJob creates Job → Job owns finite-work Pod"
      - "one Pod: importer ↔ localhost:9000 ↔ validator"
      - "declared /batch volume shares files; image filesystems remain separate"
      - "Job completion + batch ledger, rather than desired running replicas"
    teaching_point: Pods are the execution unit, while workload controllers define identity, replacement, placement, completion, or scheduling semantics around those Pods.
