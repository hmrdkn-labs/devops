visuals:
  - id: fpp:kubernetes-security-access/visual-api-security
    kind: flow
    eyebrow: API security path
    title: Authentication, authorization, and admission answer different questions
    lines:
      - "API request → authenticate identity → authorize action with RBAC → admission policy → API object mutation or rejection → persisted state"
    teaching_point: "Kubernetes security is layered: request identity, permission, admission, workload identity, Pod security, Secret handling, and network policy are separate controls."
