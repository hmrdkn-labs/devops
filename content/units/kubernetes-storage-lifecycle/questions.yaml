schema_version: 1
unit_id: fpp:kubernetes-storage-lifecycle
revision: 3
questions:
  - id: fpp:kubernetes-storage-lifecycle/q-pending
    kind: scenario
    prompt: A PVC remains Pending even though the cluster has worker nodes with free CPU and memory. Why can that happen?
    model_answer: PVC binding/provisioning is a storage control path, not a CPU scheduling decision. The StorageClass or CSI provisioner may be missing or misconfigured, the requested access mode/capacity may be unsupported, topology may prevent binding, or WaitForFirstConsumer may intentionally delay binding until scheduling context exists.
    critical_points:
      - Storage provisioning is a separate control path from compute availability.
      - StorageClass, CSI, topology, access mode, and events are relevant evidence.
    objective_ids: [fpp:kubernetes-storage-lifecycle/claim]
  - id: fpp:kubernetes-storage-lifecycle/q-zone
    kind: predict
    prompt: A Pod using a zonal block volume is lost with its node. Can a replacement Pod always reattach that exact volume in any other availability zone?
    model_answer: No. A zonal volume is constrained to its zone. A replacement can use another suitable node in that zone, but cross-zone recovery requires storage with different semantics or an application/backup replication strategy.
    critical_points:
      - Pod replacement does not erase storage topology constraints.
      - Durable recovery requirements must match the storage failure domain.
    objective_ids: [fpp:kubernetes-storage-lifecycle/failure-domain]
  - id: fpp:kubernetes-storage-lifecycle/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: In a disposable cluster that already has a working StorageClass, trace one small PVC and Pod without relying on provider-console assumptions. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Inspect available StorageClasses and identify the provisioner and volume binding mode. Create or reuse a PVC and observe its events and bound PV. Mount the claim in a test Pod and write a harmless marker file. Replace the Pod while preserving the claim and verify whether the marker remains. Record any topology or access-mode constraints shown by the objects. Treat the conclusion as justified only when PVC, StorageClass, CSI/provisioner, PV, and Pod mount responsibilities are separated. Data persistence is verified across Pod replacement rather than inferred from object existence."
    critical_points:
      - "PVC, StorageClass, CSI/provisioner, PV, and Pod mount responsibilities are separated."
      - "Data persistence is verified across Pod replacement rather than inferred from object existence."
    objective_ids: [fpp:kubernetes-storage-lifecycle/claim, fpp:kubernetes-storage-lifecycle/failure-domain]
  - id: fpp:kubernetes-storage-lifecycle/q-wait-first-consumer
    kind: explain
    prompt: Why can WaitForFirstConsumer be useful for dynamically provisioned storage in a multi-zone cluster?
    model_answer: It delays binding or provisioning until the scheduler has Pod placement context, allowing storage topology to be chosen consistently with a feasible node or zone instead of provisioning a volume first in a location that later blocks scheduling.
    critical_points:
      - Storage topology and Pod placement can depend on each other.
      - Delayed binding avoids choosing an incompatible failure domain too early.
    objective_ids: [fpp:kubernetes-storage-lifecycle/claim, fpp:kubernetes-storage-lifecycle/failure-domain]
  - id: fpp:kubernetes-storage-lifecycle/q-reclaim-policy
    kind: scenario
    prompt: A PVC is deleted after an application is removed. Why can you not infer from the PVC deletion alone whether the underlying storage and data were also deleted?
    model_answer: The outcome depends on the bound PV and StorageClass reclaim policy plus provider behavior. A Delete policy may remove the backing volume, while Retain preserves the PV or underlying asset for manual handling, so inspect the PV and reclaim policy before making a data-loss claim.
    critical_points:
      - PVC deletion and backing-storage deletion are separate lifecycle events.
      - Reclaim policy determines what should happen to the PV or storage after release.
    objective_ids: [fpp:kubernetes-storage-lifecycle/claim, fpp:kubernetes-storage-lifecycle/failure-domain]
