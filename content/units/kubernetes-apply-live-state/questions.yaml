schema_version: 1
unit_id: fpp:kubernetes-apply-live-state
revision: 2
questions:
  - id: fpp:kubernetes-apply-live-state/q-configured
    kind: scenario
    prompt: kubectl apply returns configured after you change an image, but the application remains unavailable. What should you conclude before running any more commands?
    model_answer: Conclude only that the Deployment API update succeeded. The next hypothesis is whether the Deployment and new ReplicaSet reconciled, then whether Pods became Ready and networking selected them. Read live state and follow the ownership/request path instead of treating apply as end-to-end proof.
    critical_points:
      - configured proves the API update, not application availability.
      - Choose the next observation from the control and request path.
    objective_ids: [fpp:kubernetes-apply-live-state/live-state]
  - id: fpp:kubernetes-apply-live-state/q-three-states
    kind: explain
    prompt: Why should you distinguish a local manifest, the live API object, and runtime reality when using declarative Kubernetes configuration?
    model_answer: The file is authored intent, the live object is the API's current desired/observed record with defaults and updates from multiple actors, and runtime reality is what controllers and nodes actually achieved. A failure or drift can exist between any two of those layers.
    critical_points:
      - Local configuration and live object are not automatically identical.
      - Live desired state and runtime convergence are separate layers.
    objective_ids: [fpp:kubernetes-apply-live-state/declarative, fpp:kubernetes-apply-live-state/live-state]
  - id: fpp:kubernetes-apply-live-state/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Apply one Deployment in a disposable namespace, then compare the local file with the live API object and runtime evidence. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Apply the manifest and record only what the command result actually proves. Fetch the live Deployment as YAML and identify fields added or updated by the cluster. Compare desired replicas with available replicas and then inspect the owning ReplicaSet and Pods. Treat the conclusion as justified only when The write result is not described as proof of application health. At least one difference between authored configuration and live/observed state is identified."
    critical_points:
      - "The write result is not described as proof of application health."
      - "At least one difference between authored configuration and live/observed state is identified."
    objective_ids: [fpp:kubernetes-apply-live-state/declarative, fpp:kubernetes-apply-live-state/live-state]
