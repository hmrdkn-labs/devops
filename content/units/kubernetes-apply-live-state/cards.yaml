schema_version: 1
unit_id: fpp:kubernetes-apply-live-state
revision: 1
cards:
  - id: fpp:kubernetes-apply-live-state/c-apply
    type: short
    front: What does kubectl apply primarily change?
    back: The live Kubernetes API object fields represented by the declarative configuration.
    critical_points: []
    objective_ids: [fpp:kubernetes-apply-live-state/declarative]
  - id: fpp:kubernetes-apply-live-state/c-status
    type: short
    front: Should your local manifest normally be treated as the source of live status fields?
    back: No. Kubernetes components update observed status in the live object.
    critical_points: []
    objective_ids: [fpp:kubernetes-apply-live-state/live-state]
  - id: fpp:kubernetes-apply-live-state/c-declarative
    type: short
    front: What makes a workflow declarative?
    back: It describes desired state rather than only a sequence of actions.
    critical_points: []
    objective_ids: [fpp:kubernetes-apply-live-state/declarative]
  - id: fpp:kubernetes-apply-live-state/c-explain
    type: prompt
    front: Explain the three layers local file → live API object → runtime reality.
    back: The file records authored intent; the API object records current cluster state and desired fields; controllers and nodes attempt to make runtime resources match that desired state.
    critical_points: [Each boundary can diverge and needs separate evidence]
    objective_ids: [fpp:kubernetes-apply-live-state/live-state]
  - id: fpp:kubernetes-apply-live-state/c-scenario
    type: scenario
    front: A teammate manually scales a Deployment after your manifest was last applied. What kind of drift might now exist?
    back: "File-versus-live desired-state drift: the live replica count may differ from the value recorded in the versioned manifest."
    critical_points: [Identify which two state layers diverged]
    objective_ids: [fpp:kubernetes-apply-live-state/live-state]
