schema_version: 1
unit_id: fpp:http-tls
revision: 3
questions:
  - id: fpp:http-tls/q-certificate
    kind: predict
    prompt: DNS resolves and TCP connects, but the certificate does not cover the requested hostname. Should the client continue?
    model_answer: A correctly validating client should reject the connection. Encryption was negotiated, but the peer did not prove the expected hostname identity.
    critical_points:
      - Reachability is not identity.
      - Hostname validation is part of TLS verification.
    objective_ids: [fpp:http-tls/tls-identity]
  - id: fpp:http-tls/q-502
    kind: scenario
    prompt: An ingress proxy returns HTTP 502. What layer is proven to work, and what likely boundary failed?
    model_answer: The client reached an HTTP-speaking proxy. The proxy could not obtain a valid upstream response, so inspect backend endpoint selection, transport, TLS, and application health.
    critical_points:
      - An HTTP status localizes the response-producing layer.
      - Proxy-to-upstream is a separate connection.
    objective_ids: [fpp:http-tls/http-message]
  - id: fpp:http-tls/q-practice-transfer
    kind: scenario
    prompt: "https://orders.test/health resolves to 192.0.2.60 and curl reports a certificate hostname mismatch: the server certificate covers billing.test. A colleague gets HTTP 200 by using -k and proposes changing only the HTTP Host header. Which identity has failed, and which probe can preserve orders.test identity while pinning the connection address?"
    model_answer: "The client cannot authenticate the server for the URL hostname orders.test. -k bypasses certificate verification, so its 200 does not prove a valid authenticated HTTPS transaction. An HTTP Host override alone does not set the TLS verification name or SNI to that value. curl --resolve orders.test:443:192.0.2.60 https://orders.test/health pins the address while retaining the URL hostname for TLS and HTTP; it should still reject the wrong certificate until certificate/listener configuration is corrected. Then verify the original URL without the override."
    critical_points:
      - "TLS verifies the URL's server identity before the HTTP request succeeds."
      - "-k removes the identity check and weakens what HTTP 200 proves."
      - "--resolve changes address lookup while preserving the requested hostname."
    objective_ids: [fpp:http-tls/http-message, fpp:http-tls/tls-identity]
