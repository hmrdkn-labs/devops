schema_version: 1
unit_id: fpp:troubleshoot-process-to-pod
revision: 4
questions:
  - id: fpp:troubleshoot-process-to-pod/q-crashloop
    kind: scenario
    prompt: A Pod is in CrashLoopBackOff. What evidence should you collect before changing the manifest?
    model_answer: Inspect container current and previous state, exit code or signal, termination reason, events, the effective command and configuration, and previous-instance logs. Then map the evidence to the underlying process failure.
    critical_points:
      - CrashLoopBackOff is retry behavior, not the root cause.
      - Previous execution evidence is essential.
    objective_ids: [fpp:troubleshoot-process-to-pod/evidence-ladder, fpp:troubleshoot-process-to-pod/cross-layer]
  - id: fpp:troubleshoot-process-to-pod/q-order
    kind: explain
    prompt: Why should you inspect Service endpoints before editing DNS when a Service name resolves but requests fail?
    model_answer: Resolution already proves the name lookup path. Endpoint membership is the next dependency and can show selector or readiness failure without making an unrelated DNS change.
    critical_points:
      - Let evidence choose the next layer.
      - Change only after localizing the failed relationship.
    objective_ids: [fpp:troubleshoot-process-to-pod/evidence-ladder]
  - id: fpp:troubleshoot-process-to-pod/q-practice-transfer
    kind: scenario
    prompt: "In namespace demo, checkout resolves to 10.96.20.4. The Service selects app=checkout and targetPort 8080. The only Running, Ready Pod has label app=cart and listens on 0.0.0.0:8080. Its direct Pod-IP probe returns HTTP 200, but checkout has no EndpointSlice backend addresses. What exact relationship is broken, and what would verify a reviewed repair?"
    model_answer: "The Service selector does not match the intended Pod label, so the endpoint controller cannot populate that Pod as this Service's backend. DNS resolution proves discovery of the Service address; the direct Pod probe supports one process path but not Service routing. Read Service selectors, Pod labels and relevant EndpointSlices before changing state. Correct the intended selector/label relationship through the owning workload configuration, observe the selected ready backend, then repeat the original checkout request from the same client. Endpoints alone are not proof that the Service packet path works."
    critical_points:
      - "The observed selector-to-label mismatch localizes missing backend membership."
      - "Running/Ready and a direct Pod probe do not prove the Service path."
      - "Verification must repeat the original user-visible transaction after endpoint membership updates."
    objective_ids: [fpp:troubleshoot-process-to-pod/evidence-ladder, fpp:troubleshoot-process-to-pod/cross-layer]

  - id: fpp:troubleshoot-process-to-pod/q-pending
    kind: scenario
    prompt: A Pod has never left Pending. Why should logs usually not be your first diagnostic step, and what evidence should you inspect instead?
    model_answer: A container may not have started yet, so application logs can be absent or irrelevant. Inspect Pod conditions and events, node assignment, scheduler messages, resource requests, placement constraints, PVC state, and image or sandbox setup depending on how far the Pod progressed.
    critical_points:
      - Evidence should match the lifecycle stage reached by the Pod.
      - Pending often points to scheduling or setup before application execution.
    objective_ids: [fpp:troubleshoot-process-to-pod/evidence-ladder, fpp:troubleshoot-process-to-pod/cross-layer]
  - id: fpp:troubleshoot-process-to-pod/q-connection-refused
    kind: scenario
    prompt: Service DNS resolves, EndpointSlice contains a Ready Pod IP, but a request to the Service returns connection refused. Which earlier layers are already supported, and what should you inspect next?
    model_answer: DNS resolution and backend selection are supported by evidence, and the Pod is considered ready for endpoint membership. Inspect the targetPort-to-container-port relationship, whether the process is actually listening on the expected address and port, container logs, and the same request directly at the Pod boundary before blaming DNS.
    critical_points:
      - Preserve evidence for layers already proven instead of restarting diagnosis from DNS.
      - Move toward the listening process and port mapping as the next boundary.
    objective_ids: [fpp:troubleshoot-process-to-pod/evidence-ladder, fpp:troubleshoot-process-to-pod/cross-layer]
