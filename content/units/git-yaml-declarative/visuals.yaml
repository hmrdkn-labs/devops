schema_version: 1
unit_id: fpp:git-yaml-declarative
revision: 4
visuals:
  - id: fpp:git-yaml-declarative/visual-intent-pipeline
    kind: flow
    eyebrow: Intent pipeline
    title: "Git and the API can hold competing desired values"
    lines:
      - "Git c7: replicas 3 → inert reviewed snapshot"
      - "manual scale → API spec replicas 5"
      - "Deployment controller watches API → reconciles five"
      - "GitOps/apply would be a separate Git → API transfer boundary"
    teaching_point: "Git intent is not automatically input to the built-in controller. Live spec is desired API state; status/Pods report observed execution. Validation/dry-run, persistence and reconciliation are distinct claims."
