schema_version: 1
unit_id: fpp:kubernetes-deployments-rollouts
revision: 4
questions:
  - id: fpp:kubernetes-deployments-rollouts/q-new-rs
    kind: predict
    prompt: You change only the container image inside a Deployment Pod template. Why should you expect a new ReplicaSet instead of the existing Pods being edited in place?
    model_answer: A Pod-template change represents a new desired template revision. The Deployment creates a new ReplicaSet for that template and gradually shifts replicas from the old ReplicaSet to the new one, replacing Pods rather than mutating their running containers in place.
    critical_points:
      - Pod-template change creates a new rollout revision.
      - Deployment manages ReplicaSets; ReplicaSets manage Pods.
    objective_ids: [fpp:kubernetes-deployments-rollouts/ownership-chain, fpp:kubernetes-deployments-rollouts/revision]
  - id: fpp:kubernetes-deployments-rollouts/q-rollout-proof
    kind: scenario
    prompt: kubectl rollout status reports success, but users still receive connection errors. What does rollout success prove, and where do you investigate next?
    model_answer: It proves the Deployment reached its rollout criteria for the desired replica/template state. Continue downstream through Pod readiness, Service selector and endpoints, Ingress or load-balancer routing, DNS, and the application request path.
    critical_points:
      - Deployment convergence is not end-to-end reachability.
      - Continue evidence gathering downstream of the controller.
    objective_ids: [fpp:kubernetes-deployments-rollouts/revision]
  - id: fpp:kubernetes-deployments-rollouts/q-practice-transfer
    kind: scenario
    prompt: "A Deployment starts with image web:v1, ReplicaSet A at three replicas, and no ReplicaSet B. After its template image becomes web:v2, A decreases and B increases. What caused B, and which evidence would prove rollout progress without claiming that checkout requests now succeed?"
    model_answer: "Changing the Deployment Pod template triggers rollout and a ReplicaSet for the new template. Compare Deployment template, ReplicaSet templates and ownerReferences, and Pod owners; inspect rollout status or available/updated replica counts. These establish rollout progress. A representative application request is separate evidence of user-visible health."
    critical_points:
      - "Template change causes the new ReplicaSet."
      - "Controller rollout status differs from application transaction success."
    objective_ids: [fpp:kubernetes-deployments-rollouts/ownership-chain, fpp:kubernetes-deployments-rollouts/revision]

  - id: fpp:kubernetes-deployments-rollouts/q-rollback
    kind: predict
    prompt: What does a Deployment rollback conceptually change, and why is it wrong to think Kubernetes revives the old Pods themselves?
    model_answer: A rollback changes the Deployment's desired Pod template back to a previous revision. The Deployment then reconciles ReplicaSet replica counts toward that template; old Pod objects are not resurrected, and replacement Pods are still new runtime instances.
    critical_points:
      - Rollback changes desired template revision, not historical Pod identity.
      - Deployment reconciles ReplicaSets, which in turn manage Pods.
    objective_ids: [fpp:kubernetes-deployments-rollouts/ownership-chain, fpp:kubernetes-deployments-rollouts/revision]
  - id: fpp:kubernetes-deployments-rollouts/q-unready-rollout
    kind: scenario
    prompt: A rollout creates new Pods that are Running but remain NotReady. Why can the Deployment still stall instead of declaring success?
    model_answer: Deployment availability depends on Ready or available replicas, not merely Pod phase. If the new Pods fail readiness, the controller may be unable to satisfy its progress and availability requirements while respecting maxUnavailable and maxSurge, so inspect readiness conditions and rollout status.
    critical_points:
      - Running does not imply available for a Deployment rollout.
      - Readiness influences whether the rollout can safely advance.
    objective_ids: [fpp:kubernetes-deployments-rollouts/revision]
