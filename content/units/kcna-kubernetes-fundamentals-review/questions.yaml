schema_version: 1
unit_id: fpp:kcna-kubernetes-fundamentals-review
revision: 4
questions:
  - id: fpp:kcna-kubernetes-fundamentals-review/q-request-path
    kind: scenario
    prompt: A new Pod object exists but has no node assignment. Which component should make the next placement decision, and which component will eventually start its containers?
    model_answer: The kube-scheduler chooses a suitable node for the unscheduled Pod. After the assignment is visible through the API, the kubelet on that node asks the container runtime to create and start the Pod's containers.
    critical_points:
      - Scheduler chooses placement.
      - Kubelet and runtime execute on the chosen node.
    objective_ids: [fpp:kcna-kubernetes-fundamentals-review/ownership]
  - id: fpp:kcna-kubernetes-fundamentals-review/q-runtime
    kind: explain
    prompt: Why is "Kubernetes removed Docker support" an inaccurate description of the dockershim removal?
    model_answer: Kubernetes removed its built-in dockershim integration with Docker Engine. Kubernetes still runs OCI-compatible images and communicates with CRI-compatible runtimes such as containerd or CRI-O. Docker-built images remain usable when they conform to the supported image format.
    critical_points:
      - Dockershim was an integration layer.
      - OCI-compatible images still run.
      - Kubernetes uses CRI-compatible runtimes.
    objective_ids: [fpp:kcna-kubernetes-fundamentals-review/runtime]
  - id: fpp:kcna-kubernetes-fundamentals-review/q-practice-transfer
    kind: scenario
    prompt: "A replacement Pod owned by a ReplicaSet already has spec.nodeName=worker-b and image registry.test/api@sha256:… . Its container is Waiting with ImagePullBackOff. The node uses containerd. Which cluster decision is already recorded, who owns the next execution boundary, and which evidence distinguishes this from the ReplicaSet failing to create a Pod?"
    model_answer: "Placement on worker-b is recorded; ordinary scheduling is no longer the missing step. The kubelet on worker-b asks its CRI runtime, containerd, to realize the assigned Pod, including obtaining the image. Inspect Pod events and container waiting reason, then use crictl against the node's explicit CRI endpoint for runtime evidence. The Pod and its owner reference show that Pod creation occurred. The API and etcd store state; they do not fetch this image or execute its process. nodeName can also be set directly, so it alone does not prove a particular scheduler made the assignment."
    critical_points:
      - "nodeName records placement, but does not identify the placement actor by itself."
      - "Kubelet and CRI runtime own node execution and image realization."
      - "Existing Pod ownership and events separate controller creation from runtime failure."
    objective_ids: [fpp:kcna-kubernetes-fundamentals-review/ownership, fpp:kcna-kubernetes-fundamentals-review/runtime]

  - id: fpp:kcna-kubernetes-fundamentals-review/q-runtime-endpoint
    kind: explain
    prompt: A worker node uses containerd and crictl must inspect the CRI state. What are three supported ways to select the runtime endpoint, and why is choosing the endpoint explicitly useful?
    model_answer: crictl can receive the runtime endpoint through the --runtime-endpoint/-r flag, the CONTAINER_RUNTIME_ENDPOINT environment variable, or runtime-endpoint in its config file such as /etc/crictl.yaml. An explicit endpoint makes the client/runtime boundary unambiguous and avoids relying on deprecated probing of default sockets.
    critical_points:
      - The --runtime-endpoint/-r flag can select the endpoint.
      - CONTAINER_RUNTIME_ENDPOINT can select the endpoint.
      - The crictl config file can persist runtime-endpoint.
      - The endpoint identifies the CRI socket crictl should actually inspect.
    objective_ids: [fpp:kcna-kubernetes-fundamentals-review/runtime]
  - id: fpp:kcna-kubernetes-fundamentals-review/q-runtime-tool-choice
    kind: scenario
    prompt: "You have three tasks on a containerd-based node: inspect the CRI view used for Kubernetes troubleshooting, debug containerd at a low level, and use a Docker-like CLI for an interactive container workflow. Which tool fits each task, and why?"
    model_answer: Use crictl for CRI-focused Kubernetes runtime troubleshooting, ctr for low-level containerd debugging, and nerdctl for a Docker-compatible containerd workflow. The commands may reach the same runtime ecosystem, but they expose different operational boundaries and user experiences.
    critical_points:
      - crictl maps to CRI-focused troubleshooting.
      - ctr maps to low-level containerd debugging.
      - nerdctl maps to a Docker-compatible containerd CLI workflow.
    objective_ids: [fpp:kcna-kubernetes-fundamentals-review/runtime]
