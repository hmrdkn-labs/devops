schema_version: 1
unit_id: fpp:kcna-kubernetes-fundamentals-review
revision: 4
visuals:
  - id: fpp:kcna-kubernetes-fundamentals-review/visual-component-ownership
    kind: ownership
    eyebrow: Component ownership
    title: "A recorded node assignment is not a running container"
    lines:
      - "ReplicaSet → replacement Pod exists (creation evidence)"
      - "Pod nodeName=worker-b → placement recorded"
      - "worker-b kubelet → CRI containerd → image pull retries"
      - "Waiting/ImagePullBackOff → no proof of process start"
      - "API/etcd store state; node components execute"
    teaching_point: "nodeName records placement, but does not identify the placement actor by itself. Kubelet and CRI runtime own node execution and image realization. Existing Pod ownership and events separate controller creation from runtime failure."
  - id: fpp:kcna-kubernetes-fundamentals-review/visual-runtime-tools
    kind: ownership
    eyebrow: Runtime tooling
    title: Pick the CLI by the boundary you are inspecting
    lines:
      - "Kubernetes runtime troubleshooting → crictl → CRI endpoint"
      - "Low-level containerd debugging → ctr → containerd"
      - "Docker-like containerd workflow → nerdctl → containerd"
    teaching_point: Similar-looking container commands are not interchangeable mental models; first identify whether the task is about the CRI boundary, containerd internals, or a user-facing container workflow.
