schema_version: 1
unit_id: fpp:namespaces-cgroups
revision: 2
questions:
  - id: fpp:namespaces-cgroups/q-difference
    kind: explain
    prompt: What question do namespaces answer, and what different question do cgroups answer?
    model_answer: Namespaces define the resources and identities a process can see. Cgroups group processes to account for, prioritize, and limit their resource consumption.
    critical_points:
      - Namespaces scope visibility.
      - Cgroups control resource use.
    objective_ids: [fpp:namespaces-cgroups/isolation, fpp:namespaces-cgroups/resource-control]
  - id: fpp:namespaces-cgroups/q-memory
    kind: scenario
    prompt: The host has free memory, but one container is OOM-killed after crossing its limit. How can both facts be true?
    model_answer: The process belongs to a memory cgroup with a lower boundary than total host memory. Enforcement occurs at the cgroup even though the host still has capacity.
    critical_points:
      - Cgroup limits are independent of host-wide free memory.
      - A container is still a host process under cgroup policy.
    objective_ids: [fpp:namespaces-cgroups/resource-control]
  - id: fpp:namespaces-cgroups/q-practice-transfer
    kind: scenario
    prompt: "Plan this exercise before touching the system: Inspect the namespaces and cgroup membership of your shell without changing the host. What sequence would you follow, and what evidence would prove success?"
    model_answer: "A strong evidence-first plan is: Record your shell PID. List the namespace links under /proc/PID/ns. Read the process cgroup membership under /proc/PID/cgroup. Treat the conclusion as justified only when You can identify at least three namespace types. You can explain why namespace IDs and cgroup paths describe different boundaries."
    critical_points:
      - "You can identify at least three namespace types."
      - "You can explain why namespace IDs and cgroup paths describe different boundaries."
    objective_ids: [fpp:namespaces-cgroups/isolation, fpp:namespaces-cgroups/resource-control]
