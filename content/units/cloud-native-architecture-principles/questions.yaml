schema_version: 1
unit_id: fpp:cloud-native-architecture-principles
revision: 4
questions:
  - id: fpp:cloud-native-architecture-principles/q-cloud
    kind: explain
    prompt: Why is moving an unchanged, manually configured application server from an on-premises VM to a cloud VM not enough by itself to call the system cloud-native?
    model_answer: The hosting location changed, but the operating model may still depend on mutable individual servers, manual recovery, tight coupling, and weak observability. Cloud-native architecture emphasizes automation, declarative control, replaceable artifacts, explicit interfaces, resilience, and observable runtime behavior in dynamic environments.
    critical_points:
      - Cloud hosting and cloud-native architecture are not synonyms.
      - Operating model and system properties matter more than provider location.
    objective_ids: [fpp:cloud-native-architecture-principles/properties]
  - id: fpp:cloud-native-architecture-principles/q-scale
    kind: scenario
    prompt: A Deployment always runs ten replicas even at night. Is that automatically an example of elasticity?
    model_answer: No. It is replication at a fixed desired capacity. Elasticity means capacity can expand and contract with demand or policy; an autoscaler is one mechanism that can change the desired replica count to support elasticity.
    critical_points:
      - Replication does not automatically imply elasticity.
      - Autoscaling changes desired capacity based on signals or policy.
    objective_ids: [fpp:cloud-native-architecture-principles/scale]
  - id: fpp:cloud-native-architecture-principles/q-practice-transfer
    kind: scenario
    prompt: "Checkout moves from one hand-configured cloud VM to three declaratively deployed replicas. A controller replaces failed replicas, but all replicas depend on one database and replica count stays three when demand drops. Which cloud-native operating properties improved, and which resilience or elasticity claims remain unsupported?"
    model_answer: "Reviewed desired state and automatic replacement make configuration and recovery repeatable, and versioned replaceable artifacts can improve delivery. Three replicas provide redundancy only for failures they do not share; a single database outage can still stop all checkout transactions. Fixed replicas do not establish elasticity because capacity does not expand or contract with demand. Inspect replacement events, artifact identity, demand/capacity history and transaction probes; a cloud address or replica count alone proves none of those system-wide outcomes."
    critical_points:
      - "Declarative automation and replaceability describe concrete operating improvements."
      - "Shared database dependence limits resilience; fixed replication does not prove elasticity."
    objective_ids: [fpp:cloud-native-architecture-principles/properties, fpp:cloud-native-architecture-principles/scale]
  - id: fpp:cloud-native-architecture-principles/q-autoscaler-chain
    kind: scenario
    prompt: HPA increases checkout's desired replicas from three to six, but three new Pods stay Pending because suitable nodes lack free capacity. Which autoscaler changes which resource, and what would show usable capacity actually improved?
    model_answer: HPA changes the workload replica target. A supported node autoscaler such as Cluster Autoscaler can add suitable node-group capacity for unschedulable Pods. VPA instead recommends or changes Pod resource requests. Inspect HPA conditions, Pending events, node-group limits and placement constraints, then verify ready nodes, scheduled/ready Pods and checkout latency. More requested replicas alone proves neither execution nor throughput.
    critical_points:
      - HPA replicas, VPA resource sizing and node autoscaling are different control targets.
      - Node readiness, Pod readiness and transaction metrics are later proof boundaries.
    objective_ids: [fpp:cloud-native-architecture-principles/scale]
  - id: fpp:cloud-native-architecture-principles/q-serverless-fit
    kind: explain
    prompt: Compare a bursty, short webhook handler with a continuously busy, latency-sensitive process. Why might serverless fit the first better, and what responsibility remains with the application owner?
    model_answer: Request/event-driven managed execution can expand for bursts and release idle capacity, while cold starts, execution limits and pricing may make it less attractive for a continuously busy process. The platform manages servers, not the absence of servers. The owner still designs application correctness, durable external state, permissions and observability, and must test latency and reliability requirements.
    critical_points:
      - Serverless delegates infrastructure lifecycle rather than eliminating infrastructure.
      - Workload shape and latency/state requirements determine fit.
    objective_ids: [fpp:cloud-native-architecture-principles/scale]
  - id: fpp:cloud-native-architecture-principles/q-mesh-owner
    kind: predict
    prompt: In an Istio sidecar deployment, checkout calls inventory through Envoy proxies. Is Istiod another proxy hop for each business request, and does mutual TLS prove inventory authorized the checkout operation?
    model_answer: No to both. Istiod supplies control-plane configuration and workload certificates; the workload-side Envoy proxies execute the configured traffic path. Mutual TLS authenticates/encrypts the participating connection, while authorization policy and application business authorization are additional decisions. A mesh does not replace application correctness or all other security controls.
    critical_points:
      - Mesh control-plane configuration is separate from proxy data-plane execution.
      - Encrypted/authenticated transport is not complete business authorization.
    objective_ids: [fpp:cloud-native-architecture-principles/mesh]
