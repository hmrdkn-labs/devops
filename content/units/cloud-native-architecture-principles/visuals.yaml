  - id: fpp:cloud-native-architecture-principles/visual-system-loop
    kind: flow
    eyebrow: System model
    title: Cloud-native systems close the feedback loop
    lines:
      - "checkout v6 + replicas=3 → controller restores one lost instance"
      - "all replicas → one database → shared failure remains"
      - "night demand −90%, replicas still 3 → replication, no demonstrated contraction"
      - "transaction probe and demand/capacity history test different properties"
    teaching_point: Cloud-native architecture is defined by adaptable feedback loops and loose coupling, not merely by running software in a cloud.
