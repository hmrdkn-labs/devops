schema_version: 1
unit_id: fpp:kubernetes-networking-request-path
revision: 5
questions:
  - id: fpp:kubernetes-networking-request-path/q-node-ip
    kind: explain
    prompt: Why is assigning only an IP address to each worker node not enough for the Kubernetes Pod networking model?
    model_answer: Multiple Pods and replicas need distinct network identities independent of the node they happen to run on. Pod IPs let workloads communicate without treating every Pod as a node-port mapping, while Services provide a stable identity above replaceable Pod IPs.
    critical_points:
      - Pod identity is separate from node identity.
      - Stable client discovery belongs at the Service layer because Pod IPs are replaceable.
    objective_ids: [fpp:kubernetes-networking-request-path/boundaries]
  - id: fpp:kubernetes-networking-request-path/q-no-endpoints
    kind: scenario
    prompt: Service DNS resolves correctly, but the EndpointSlice has no ready endpoints. Which layers are already proven and what should you inspect next?
    model_answer: DNS and the existence of the Service are proven, but backend selection/readiness is not. Inspect the Service selector, Pod labels, Pod readiness, and target application state before blaming cluster routing.
    critical_points:
      - DNS success does not prove backend availability.
      - Endpoint selection depends on selectors and readiness.
    objective_ids: [fpp:kubernetes-networking-request-path/service-path]
  - id: fpp:kubernetes-networking-request-path/q-practice-transfer
    kind: scenario
    prompt: "A client resolves api.team.svc to its expected ClusterIP. The Service selects app=api, but its EndpointSlices have no ready backend addresses. Does successful DNS prove a working request path, and which observation separates discovery from backend readiness?"
    model_answer: "No. DNS established service-name resolution, not usable backends or transport/application success. Inspect Service selector, matching Pod labels/readiness and EndpointSlice addresses/conditions. Empty ready backend membership localizes a missing routing destination; a client request and network implementation evidence test later forwarding behavior."
    critical_points:
      - "DNS success does not prove end-to-end reachability."
      - "EndpointSlice membership and readiness describe available backend destinations."
    objective_ids: [fpp:kubernetes-networking-request-path/service-path, fpp:kubernetes-networking-request-path/boundaries]

  - id: fpp:kubernetes-networking-request-path/q-boundary-map
    kind: scenario
    prompt: "Map each symptom to the first Kubernetes networking boundary you would inspect: Pods cannot obtain usable Pod connectivity, a Service name does not resolve, DNS resolves but no backends are selected, and an otherwise valid connection is intentionally denied by policy."
    model_answer: Inspect the CNI and Pod network for Pod connectivity, cluster DNS for name resolution, Service selectors and EndpointSlices for backend selection, and NetworkPolicy plus its enforcing dataplane for intentional traffic restrictions.
    critical_points:
      - CNI, DNS, Service selection, and NetworkPolicy are distinct boundaries.
      - Start at the first unsupported hop instead of treating every symptom as one networking layer.
    objective_ids: [fpp:kubernetes-networking-request-path/boundaries, fpp:kubernetes-networking-request-path/service-path]
  - id: fpp:kubernetes-networking-request-path/q-policy-enforcement
    kind: predict
    prompt: A NetworkPolicy object is accepted by the API, but the cluster's networking implementation does not enforce NetworkPolicy. Does the object alone guarantee packet filtering?
    model_answer: No. The API object expresses policy intent, but an implementation in the network dataplane must enforce it. Verify that the installed CNI or policy engine supports the policy semantics before treating the object as proof of isolation.
    critical_points:
      - Policy intent and dataplane enforcement are separate evidence.
      - NetworkPolicy requires an enforcing implementation.
    objective_ids: [fpp:kubernetes-networking-request-path/boundaries]
  - id: fpp:kubernetes-networking-request-path/q-cni-sandbox
    kind: scenario
    prompt: The scheduler assigned a Pod to node-a, but events report a sandbox network setup failure and the Pod has no usable interface. Would changing the Service selector fix it? Name the next integration boundary and what later traffic proof still remains.
    model_answer: No. The kubelet asks the CRI runtime to create a sandbox, and its networking integration uses the configured CNI implementation to create interfaces, addresses and connectivity. Inspect the node's network implementation and Pod events before Service selection. CNI is a contract, not the running packet executor; the installed routes/overlay/dataplane carry traffic. Once setup succeeds, separately test inter-Pod connectivity, policy and the application listener/request.
    critical_points:
      - Pod sandbox networking precedes Service backend selection.
      - Setup success is not proof of later packet forwarding or user outcomes.
    objective_ids: [fpp:kubernetes-networking-request-path/boundaries]
