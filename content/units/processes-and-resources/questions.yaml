schema_version: 1
unit_id: fpp:processes-and-resources
revision: 3
questions:
  - id: fpp:processes-and-resources/q-process
    kind: explain
    prompt: A binary exists on disk but has not been started. What changes when it becomes a process?
    model_answer: The operating system creates a running execution with a process ID, address space, scheduling state, open-file table, identity, and environment. The bytes on disk remain the program.
    critical_points:
      - A program is passive; a process is an execution.
      - Each execution has its own runtime state and identity.
    objective_ids: [fpp:processes-and-resources/process-model]
  - id: fpp:processes-and-resources/q-pressure
    kind: predict
    prompt: CPU is mostly idle, but requests wait while disk latency is high. What process state and bottleneck would you expect?
    model_answer: Workers are likely blocked or sleeping while they wait for I/O. Adding CPU does not remove the storage bottleneck; inspect I/O queues and the dependency performing the slow operation.
    critical_points:
      - Idle CPU does not imply spare end-to-end capacity.
      - A blocked process waits for a resource other than CPU.
    objective_ids: [fpp:processes-and-resources/resource-pressure]
  - id: fpp:processes-and-resources/q-practice-transfer
    kind: scenario
    prompt: "Two workers run the same /usr/local/bin/report program. PID 410 has state R and growing CPU time; PID 411 has state D during slow report writes. Requests handled by 411 lag while the machine has idle cores. Which state belongs to the program versus each execution, and would adding a core directly unblock 411?"
    model_answer: "The executable bytes are shared input; each PID has its own execution state, descriptors and resource use. R means 410 is runnable or running, while D indicates an uninterruptible wait consistent with the stated I/O delay. The kernel schedules runnable work, but another core does not satisfy 411's pending I/O. Compare repeated process-state/CPU samples and storage latency before attributing the wait to storage; D alone does not identify the device."
    critical_points:
      - "Execution state belongs to a PID, not to the executable file."
      - "An I/O wait and a runnable CPU queue are different resource boundaries."
      - "Repeated process and storage evidence is needed; one state sample is not a root cause."
    objective_ids: [fpp:processes-and-resources/process-model, fpp:processes-and-resources/resource-pressure]
