visuals:
  - id: fpp:processes-and-resources/visual-resource-pressure
    kind: state
    eyebrow: Process model
    title: "Two executions, two different bottlenecks"
    lines:
      - "/usr/local/bin/report → PID 410: R, CPU time increases"
      - "same program → PID 411: D, waiting; CPU time flat"
      - "kernel schedules runnable work; I/O completion wakes waiting work"
      - "process state + same-window device latency → bounded bottleneck hypothesis"
    teaching_point: "Execution state belongs to a PID, not to the executable file. An I/O wait and a runnable CPU queue are different resource boundaries. Repeated process and storage evidence is needed; one state sample is not a root cause."
