schema_version: 1
id: practice:kcna
slug: kcna-mcq
title: KCNA MCQ refresher
summary: Independently authored KCNA refresher questions covering Kubernetes concepts, kubectl command recognition, scenarios, and multi-select reasoning.
revision: 4
certification: cncf:kcna
verified_at: 2026-09-16
questions:
  - id: practice:kcna/q-api-entry
    checkpoint: fundamentals
    category: concept
    select: single
    prompt: A kubectl request reaches the Kubernetes control plane. Which component is the API entry point that authenticates, authorizes, validates, and persists the request?
    options:
      - id: a
        text: kube-apiserver
        rationale: The API server is the front door for Kubernetes API requests and coordinates authentication, authorization, admission, validation, and persistence.
      - id: b
        text: kube-scheduler
        rationale: The scheduler chooses a feasible node for unscheduled Pods; it is not the general API entry point.
      - id: c
        text: kube-controller-manager
        rationale: Controllers reconcile desired and observed state through the API, but they do not terminate every client API request.
      - id: d
        text: kubelet
        rationale: The kubelet is a node agent that drives Pod execution on one node and reports status back through the API.
    answer_ids: [a]
    explanation: Treat the API server as the control-plane boundary that every normal Kubernetes object operation crosses before other control-plane components react.
    unit_ids: [fpp:kubernetes-architecture-components]

  - id: practice:kcna/q-scheduler
    checkpoint: fundamentals
    category: scenario
    select: single
    prompt: A newly created Pod has no nodeName and is waiting for placement. Which component normally decides which eligible node should run it?
    options:
      - id: a
        text: kube-scheduler
        rationale: The scheduler evaluates unscheduled Pods against node constraints and preferences, then records a binding to the selected node.
      - id: b
        text: kube-proxy
        rationale: kube-proxy implements Service traffic forwarding on nodes; it does not perform Pod placement.
      - id: c
        text: CoreDNS
        rationale: CoreDNS provides cluster DNS resolution and does not select nodes for Pods.
      - id: d
        text: container runtime
        rationale: The runtime starts containers after node-level execution has been requested; it does not choose the node.
    answer_ids: [a]
    explanation: Placement is a control-plane scheduling decision. Execution begins later when the kubelet on the selected node observes the assigned Pod.
    unit_ids: [fpp:kubernetes-architecture-components, fpp:kubernetes-scheduling-placement]

  - id: practice:kcna/q-etcd
    checkpoint: fundamentals
    category: concept
    select: single
    prompt: Which component is the strongly consistent key-value store used by the Kubernetes control plane for cluster state?
    options:
      - id: a
        text: etcd
        rationale: etcd is the persistent distributed key-value store Kubernetes uses for control-plane state.
      - id: b
        text: CoreDNS
        rationale: CoreDNS serves DNS records for service discovery; it is not the Kubernetes state database.
      - id: c
        text: containerd
        rationale: containerd is a container runtime and does not store the authoritative Kubernetes API state.
      - id: d
        text: kubelet
        rationale: The kubelet manages node-side Pod execution and reports status, but it is not the cluster state store.
    answer_ids: [a]
    explanation: Kubernetes control-plane state is persisted in etcd through the API server rather than being owned independently by each controller.
    unit_ids: [fpp:kubernetes-architecture-components]

  - id: practice:kcna/q-kubelet-runtime
    checkpoint: fundamentals
    category: concept
    select: single
    prompt: On a worker node, which component watches assigned Pod specifications and asks the container runtime to create or stop containers?
    options:
      - id: a
        text: kubelet
        rationale: The kubelet is the node agent that reconciles assigned Pod specifications with node-level execution using the container runtime.
      - id: b
        text: kube-controller-manager
        rationale: The controller manager runs control-plane controllers and does not directly manage container processes on every node.
      - id: c
        text: kube-scheduler
        rationale: The scheduler chooses a node but does not start the containers on that node.
      - id: d
        text: etcd
        rationale: etcd persists control-plane state and never acts as the node execution agent.
    answer_ids: [a]
    explanation: "Keep placement and execution separate: the scheduler selects a node, while the kubelet on that node drives execution through the runtime."
    unit_ids: [fpp:kubernetes-architecture-components, fpp:container-lifecycle]

  - id: practice:kcna/q-interfaces
    checkpoint: fundamentals
    category: concept
    select: multiple
    prompt: Which interface-to-responsibility mappings are correct? Select all that apply.
    options:
      - id: a
        text: CRI → container runtime integration
        rationale: CRI defines the kubelet-facing runtime interface used to manage containers and Pod sandboxes.
      - id: b
        text: CNI → Pod network connectivity
        rationale: CNI plugins configure container or Pod network interfaces and connectivity.
      - id: c
        text: CSI → storage integration
        rationale: CSI standardizes how storage systems integrate with container orchestrators such as Kubernetes.
      - id: d
        text: CSI → Service load balancing
        rationale: CSI is for storage, while Service forwarding and load-balancing behavior belongs to networking components.
    answer_ids: [a, b, c]
    explanation: CRI, CNI, and CSI deliberately separate runtime, networking, and storage integration so Kubernetes can use interchangeable implementations.
    unit_ids: [fpp:kubernetes-architecture-components, fpp:kubernetes-networking-request-path, fpp:kubernetes-storage-lifecycle]

  - id: practice:kcna/q-crictl-endpoint
    checkpoint: fundamentals
    category: scenario
    select: multiple
    prompt: You want crictl to inspect the containerd CRI socket explicitly. Which approaches are valid ways to select the runtime endpoint? Select all that apply.
    options:
      - id: a
        text: crictl --runtime-endpoint unix:///run/containerd/containerd.sock ps
        code: true
        rationale: The global --runtime-endpoint/-r option explicitly selects the CRI runtime endpoint for that invocation.
      - id: b
        text: CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock crictl ps
        code: true
        rationale: cri-tools supports CONTAINER_RUNTIME_ENDPOINT as an environment-variable mechanism for selecting the runtime endpoint.
      - id: c
        text: "runtime-endpoint: unix:///run/containerd/containerd.sock in the crictl config file"
        rationale: runtime-endpoint can be persisted in the crictl configuration, commonly /etc/crictl.yaml on Linux.
      - id: d
        text: kubectl config set-context --runtime-endpoint=unix:///run/containerd/containerd.sock
        code: true
        rationale: kubectl context configuration selects Kubernetes API context information; it does not configure crictl's CRI socket.
    answer_ids: [a, b, c]
    explanation: "Flags, environment variables, and the crictl config file are three configuration surfaces for the same boundary: which CRI endpoint crictl should contact."
    unit_ids: [fpp:kcna-kubernetes-fundamentals-review, fpp:container-lifecycle]

  - id: practice:kcna/q-containerd-tool-boundaries
    checkpoint: fundamentals
    category: concept
    select: single
    prompt: Which mapping best matches the intended role of three common runtime-side CLIs on a containerd-based Kubernetes node?
    options:
      - id: a
        text: "crictl → CRI troubleshooting; ctr → low-level containerd debugging; nerdctl → Docker-compatible containerd workflow"
        rationale: This keeps the Kubernetes CRI boundary, containerd's debugging utility, and the user-facing containerd CLI as distinct layers.
      - id: b
        text: "crictl → Kubernetes scheduler; ctr → CNI configuration; nerdctl → etcd administration"
        rationale: None of these tools owns scheduling, cluster networking configuration, or etcd administration.
      - id: c
        text: "crictl → Docker Compose; ctr → Kubernetes API management; nerdctl → kubelet configuration"
        rationale: These responsibilities do not match the tools; nerdctl provides Compose-style workflows, while crictl and ctr operate at different runtime layers.
      - id: d
        text: "All three are interchangeable aliases for the same containerd command set"
        rationale: They expose different interfaces and operational goals even when they may be used around the same runtime ecosystem.
    answer_ids: [a]
    explanation: Start by identifying the boundary you are debugging. That is more durable than memorizing individual command names without context.
    unit_ids: [fpp:kcna-kubernetes-fundamentals-review, fpp:container-lifecycle]

  - id: practice:kcna/q-control-loop
    checkpoint: fundamentals
    category: concept
    select: single
    prompt: What best describes a Kubernetes controller's core job?
    options:
      - id: a
        text: Continuously compare desired and observed state and act to reduce the difference
        rationale: Reconciliation loops repeatedly observe state, compare it with intent, and make changes toward the declared target.
      - id: b
        text: Execute every kubectl command directly on a worker node
        rationale: kubectl sends API requests; controllers react to persisted state rather than forwarding commands directly to nodes.
      - id: c
        text: Store every container image used by the cluster
        rationale: Images live in registries and node caches; controllers do not act as image registries.
      - id: d
        text: Replace the Linux kernel scheduler
        rationale: Kubernetes scheduling chooses nodes for Pods and does not replace the operating system's CPU scheduler.
    answer_ids: [a]
    explanation: The reconciliation model is the unifying mental model behind Kubernetes self-healing and declarative desired state.
    unit_ids: [fpp:kubernetes-control-loop]

  - id: practice:kcna/q-delete-pod
    checkpoint: resources
    category: scenario
    select: single
    prompt: A Deployment has three healthy replicas. You delete one selected Pod manually. Why does another Pod appear without running kubectl scale?
    options:
      - id: a
        text: The ReplicaSet still desires three matching Pods and reconciles the missing replica
        rationale: Deleting the Pod changes observed state, while the ReplicaSet's desired replica count remains three.
      - id: b
        text: The Service notices the missing Pod and creates a replacement
        rationale: A Service selects and routes to endpoints; it does not own or create Pods.
      - id: c
        text: CoreDNS recreates Pods whenever their DNS records disappear
        rationale: DNS resolution does not own workload lifecycle or replacement behavior.
      - id: d
        text: The scheduler keeps a permanent copy of every deleted Pod
        rationale: The scheduler assigns new Pods to nodes but does not restore deleted objects from a private copy.
    answer_ids: [a]
    explanation: Deployment owns ReplicaSets, and the ReplicaSet directly maintains the desired count of matching Pods.
    unit_ids: [fpp:kubernetes-labels-replicasets, fpp:kubernetes-deployments-rollouts]

  - id: practice:kcna/q-spec-status
    checkpoint: resources
    category: concept
    select: multiple
    prompt: Which statements correctly distinguish spec and status on Kubernetes API objects? Select all that apply.
    options:
      - id: a
        text: spec usually expresses desired state
        rationale: For resources that expose a spec, it is where users and controllers express the intended configuration.
      - id: b
        text: status usually reports observed state
        rationale: Status is generally written by Kubernetes components to describe what has actually been observed.
      - id: c
        text: status is the normal place to request a new replica count
        rationale: Desired replica count belongs in spec, not status.
      - id: d
        text: API acceptance of spec changes does not prove the workload became healthy
        rationale: The API operation can succeed before scheduling, startup, readiness, routing, or end-to-end requests succeed.
    answer_ids: [a, b, d]
    explanation: Keeping desired state, observed state, and runtime proof separate prevents a large class of Kubernetes reasoning mistakes.
    unit_ids: [fpp:kubernetes-manifests, fpp:kubernetes-apply-live-state]

  - id: practice:kcna/q-explain-command
    checkpoint: resources
    category: kubectl
    select: single
    prompt: You cannot remember the fields under a Deployment strategy. Which command is the best schema-oriented lookup?
    options:
      - id: a
        text: kubectl explain deployment.spec.strategy
        code: true
        rationale: kubectl explain reads Kubernetes API schema information and is designed for resource and field help.
      - id: b
        text: kubectl logs deployment/web
        code: true
        rationale: Logs show application output and do not document API field structure.
      - id: c
        text: kubectl rollout undo deployment/web
        code: true
        rationale: Rollout undo changes Deployment state rather than explaining its schema.
      - id: d
        text: kubectl get nodes -o wide
        code: true
        rationale: Listing nodes provides cluster inventory and does not explain Deployment fields.
    answer_ids: [a]
    explanation: Use kubectl explain when the problem is “what field exists and where does it belong?” rather than “what is happening at runtime?”
    unit_ids: [fpp:kcna-kubernetes-resources-review, fpp:kubernetes-manifests]

  - id: practice:kcna/q-rollout-status
    checkpoint: resources
    category: kubectl
    select: single
    prompt: You changed a Deployment image and want kubectl to follow whether the rollout reaches its Deployment-level completion condition. Which command fits best?
    options:
      - id: a
        text: kubectl rollout status deployment/web
        code: true
        rationale: rollout status watches the rollout state of the named workload controller.
      - id: b
        text: kubectl explain deployment/web
        code: true
        rationale: kubectl explain expects a resource or field path, not an object name, and provides schema help rather than rollout progress.
      - id: c
        text: kubectl get namespace web
        code: true
        rationale: A Namespace lookup does not report the Deployment rollout state.
      - id: d
        text: kubectl exec deployment/web -- rollout
        code: true
        rationale: kubectl exec runs a process inside a container; it is not how Deployment rollout state is observed.
    answer_ids: [a]
    explanation: Rollout status is controller-level evidence. It is useful, but it still does not prove that an external user request succeeds end to end.
    unit_ids: [fpp:kubernetes-deployments-rollouts]

  - id: practice:kcna/q-rollout-undo
    checkpoint: resources
    category: kubectl
    select: single
    prompt: A new Deployment revision is bad and you want Kubernetes to restore the previous Pod-template revision. Which command is designed for that action?
    options:
      - id: a
        text: kubectl rollout undo deployment/web
        code: true
        rationale: rollout undo changes the Deployment back to a previous recorded rollout revision.
      - id: b
        text: kubectl delete pod --all
        code: true
        rationale: Deleting Pods causes the controller to recreate Pods from the current desired template; it does not restore an older revision.
      - id: c
        text: kubectl get deployment web -o yaml
        code: true
        rationale: This inspects live state but does not perform a rollback.
      - id: d
        text: kubectl explain deployment.spec
        code: true
        rationale: Schema help is read-only and does not change the Deployment revision.
    answer_ids: [a]
    explanation: A Kubernetes rollout rollback restores controller configuration; it does not reverse database migrations or external application side effects.
    unit_ids: [fpp:kubernetes-deployments-rollouts]

  - id: practice:kcna/q-namespace-command
    checkpoint: resources
    category: kubectl
    select: single
    prompt: You need to list Pods specifically in the payments namespace without changing your current kubectl context. Which command is the clearest choice?
    options:
      - id: a
        text: kubectl get pods -n payments
        code: true
        rationale: The -n or --namespace flag explicitly scopes this command to the payments namespace.
      - id: b
        text: kubectl get pods --node payments
        code: true
        rationale: Namespace and node placement are different dimensions; this is not the namespace flag.
      - id: c
        text: kubectl namespace payments get pods
        code: true
        rationale: kubectl does not use this command shape for namespaced reads.
      - id: d
        text: kubectl get namespace/pod/payments
        code: true
        rationale: This does not represent a valid resource reference for listing Pods in a namespace.
    answer_ids: [a]
    explanation: Namespace scope is explicit API scope; using -n keeps the operation local to one command and avoids hidden context changes.
    unit_ids: [fpp:kubernetes-namespaces-scope]

  - id: practice:kcna/q-rs-selector-path
    checkpoint: resources
    category: concept
    select: single
    prompt: In an apps/v1 ReplicaSet manifest, where would you normally put an equality-based label rule that decides which Pods count toward the ReplicaSet?
    options:
      - id: a
        text: spec.selector.matchLabels
        code: true
        rationale: ReplicaSet uses a structured LabelSelector under spec.selector; matchLabels holds equality-based label requirements.
      - id: b
        text: spec.replicas.matchLabels
        code: true
        rationale: replicas is a numeric desired count and does not contain label-selection rules.
      - id: c
        text: spec.template.spec.matchLabels
        code: true
        rationale: The Pod spec describes execution; Pod labels belong under template metadata, while controller membership belongs under selector.
      - id: d
        text: metadata.selector
        code: true
        rationale: Object metadata can contain labels and annotations, but the ReplicaSet membership selector belongs in spec.
    answer_ids: [a]
    explanation: "Keep the membership rule separate from both desired count and Pod-template labels: selector identifies the set; template metadata labels newly created Pods."
    unit_ids: [fpp:kubernetes-resource-operations, fpp:kubernetes-labels-replicasets]

  - id: practice:kcna/q-rc-selector-default
    checkpoint: resources
    category: concept
    select: single
    prompt: A legacy ReplicationController has Pod-template labels but omits spec.selector. What behavior should you recognize?
    options:
      - id: a
        text: The selector can default from the Pod-template labels
        rationale: ReplicationController supports this legacy defaulting behavior when spec.selector is omitted.
      - id: b
        text: The controller becomes cluster-scoped
        rationale: Selector omission does not change the resource scope; ReplicationController remains namespaced.
      - id: c
        text: The scheduler invents a selector after placing the first Pod
        rationale: The scheduler places Pods on nodes and does not define controller membership rules.
      - id: d
        text: The controller automatically becomes a Deployment
        rationale: Kubernetes does not convert a ReplicationController object into a Deployment.
    answer_ids: [a]
    explanation: This is legacy API recognition. Do not transfer the rule to apps/v1 Deployment, where the selector is explicit and must match the Pod template labels.
    unit_ids: [fpp:kubernetes-resource-operations]

  - id: practice:kcna/q-all-namespaces
    checkpoint: resources
    category: kubectl
    select: single
    prompt: You are in an arbitrary kubectl context and need to list Pods across every namespace without changing that context. Which command is most direct?
    options:
      - id: a
        text: kubectl get pods -A
        code: true
        rationale: -A is the shorthand for --all-namespaces and ignores the current namespace for this query.
      - id: b
        text: kubectl get pods --namespace=all
        code: true
        rationale: This asks for a namespace literally named all; it is not the all-namespaces flag.
      - id: c
        text: kubectl get pods --global
        code: true
        rationale: kubectl get does not use --global as its namespace-wide query flag.
      - id: d
        text: kubectl get namespaces/pods
        code: true
        rationale: Namespace scope is supplied by flags or resource identity rather than this resource path.
    answer_ids: [a]
    explanation: "Scope is part of the query grammar: -n chooses one namespace, while -A/--all-namespaces asks for all namespaces."
    unit_ids: [fpp:kubernetes-resource-operations, fpp:kubernetes-namespaces-scope]

  - id: practice:kcna/q-initial-namespaces
    checkpoint: resources
    category: concept
    select: multiple
    prompt: Which namespaces are created as Kubernetes initial namespaces in a normal cluster? Select all that apply.
    options:
      - id: a
        text: default
        rationale: default is the fallback namespace for namespaced objects when another namespace is not selected.
      - id: b
        text: kube-system
        rationale: kube-system is reserved for objects created by the Kubernetes system.
      - id: c
        text: kube-public
        rationale: kube-public is an initial namespace intended for cluster information readable by all clients.
      - id: d
        text: kube-node-lease
        rationale: kube-node-lease holds Lease objects used for node heartbeat signaling.
      - id: e
        text: primary
        rationale: Kubernetes does not define an initial namespace named primary.
    answer_ids: [a, b, c, d]
    explanation: "The default cluster namespace set is four, not two. Their names also hint at distinct responsibilities: general default scope, system objects, readable cluster information, and node leases."
    unit_ids: [fpp:kubernetes-resource-operations, fpp:kubernetes-namespaces-scope]

  - id: practice:kcna/q-rollout-command-map
    checkpoint: resources
    category: kubectl
    select: multiple
    prompt: Which command-to-intent mappings are correct for a Deployment? Select all that apply.
    options:
      - id: a
        text: kubectl set image deployment/web app=repo/app:v2 → change the Pod template image
        code: true
        rationale: set image imperatively updates container image fields in the workload Pod template.
      - id: b
        text: kubectl rollout history deployment/web → inspect recorded rollout revisions
        code: true
        rationale: rollout history is the read operation for previous rollout revisions.
      - id: c
        text: kubectl rollout undo deployment/web → revert rollout state to a previous revision
        code: true
        rationale: rollout undo performs the Deployment rollback operation.
      - id: d
        text: kubectl describe rollout deployment/web → revert the Deployment
        code: true
        rationale: This is not the kubectl rollback command shape; describe is an inspection family, not rollout undo.
    answer_ids: [a, b, c]
    explanation: "Keep rollout commands as a small state machine: set image mutates the template, history observes revisions, and undo changes desired rollout state back toward an earlier revision."
    unit_ids: [fpp:kubernetes-resource-operations, fpp:kubernetes-deployments-rollouts]

  - id: practice:kcna/q-client-side-last-applied
    checkpoint: resources
    category: concept
    select: single
    prompt: In classic client-side kubectl apply, why is the last-applied configuration useful when a field disappears from your local file?
    options:
      - id: a
        text: It helps kubectl recognize that the field used to be part of your declared configuration and may need to be cleared from live state
        rationale: Client-side apply compares local, live, and last-applied state to calculate its patch, including fields removed from the declaration.
      - id: b
        text: It stores Pod logs so apply can replay them after an update
        rationale: Logs are runtime output and are unrelated to apply merge calculation.
      - id: c
        text: It permanently pins the object to one API version
        rationale: The annotation records prior applied configuration; it is not an API-version lock.
      - id: d
        text: It proves the new Pods became Ready
        rationale: Apply configuration metadata says nothing about downstream runtime readiness.
    answer_ids: [a]
    explanation: Treat this as client-side apply behavior. Server-Side Apply uses API-server field managers and managedFields as its ownership mechanism.
    unit_ids: [fpp:kubernetes-resource-operations, fpp:kubernetes-apply-live-state]

  - id: practice:kcna/q-node-capacity
    checkpoint: resources
    category: scenario
    select: single
    prompt: Several new replicas are Pending because every existing Node lacks enough allocatable CPU. Which change actually adds physical cluster capacity?
    options:
      - id: a
        text: Provision or add suitable Nodes, manually or through node autoscaling
        rationale: New Nodes add CPU and memory that the scheduler can use for previously unschedulable Pods.
      - id: b
        text: Increase the Deployment replica count again
        rationale: More desired Pods increase demand but do not manufacture node resources.
      - id: c
        text: Add another Service selector
        rationale: Service selection changes traffic membership, not scheduler capacity.
      - id: d
        text: Add more labels to the Pending Pods
        rationale: Labels can affect selection or policy but do not create CPU or memory.
    answer_ids: [a]
    explanation: Workload scaling and node scaling are separate layers. Controllers can request more Pods; only node provisioning changes the compute pool available to the scheduler.
    unit_ids: [fpp:kubernetes-resource-operations, fpp:scheduling-resources-health]

  - id: practice:kcna/q-pod-network-model
    checkpoint: resources
    category: concept
    select: single
    prompt: Which statement best matches the default Kubernetes Pod network model, ignoring intentionally configured segmentation?
    options:
      - id: a
        text: Pods have cluster-network IPs and Pods on different Nodes can communicate directly; stable or public exposure is a separate Service/routing concern
        rationale: Kubernetes expects cluster-wide Pod connectivity while treating stable service identity and external exposure as separate layers.
      - id: b
        text: A Pod can only be reached from the Node that hosts it
        rationale: The Kubernetes network model is designed for Pod-to-Pod communication across Nodes, not host-local reachability only.
      - id: c
        text: Every Pod IP is automatically reachable from the public internet
        rationale: Cluster-network reachability is not the same as public exposure.
      - id: d
        text: Pods need host-port mappings before they can communicate with Pods on other Nodes
        rationale: Kubernetes networking is designed so Pod-to-Pod communication does not require host-port mappings between nodes.
    answer_ids: [a]
    explanation: Keep execution endpoints, stable Service identity, and external routing as separate layers. Pod IP is a cluster-network concept, not a public-ingress guarantee.
    unit_ids: [fpp:kubernetes-resource-operations, fpp:kubernetes-networking-request-path]

  - id: practice:kcna/q-get-all-caveat
    checkpoint: resources
    category: kubectl
    select: single
    prompt: You run kubectl get all to get a quick workload-oriented view. What should you remember before treating that output as a complete cluster inventory?
    options:
      - id: a
        text: Use kubectl api-resources to discover the API resource kinds; get all is a convenience grouping rather than proof that every kind was enumerated
        rationale: API discovery is the reliable way to enumerate resource kinds supported by the server.
      - id: b
        text: get all automatically includes every namespaced and cluster-scoped object kind
        rationale: The all category is not a guarantee that every Kubernetes resource kind is included.
      - id: c
        text: get all only prints Deployments
        rationale: It includes multiple common resource categories, not just Deployments.
      - id: d
        text: get all changes desired state before printing it
        rationale: kubectl get is a read operation and does not mutate workload desired state.
    answer_ids: [a]
    explanation: Quick views and API discovery solve different problems. Use get for object reads and api-resources when the question is what resource types the server supports.
    unit_ids: [fpp:kubernetes-resource-operations, fpp:kubernetes-object-lexicon]

  - id: practice:kcna/q-describe-pending
    checkpoint: cluster-behavior
    category: kubectl
    select: single
    prompt: A Pod is Pending and you want conditions plus recent scheduling events that explain why no node was selected. Which command is the strongest first choice?
    options:
      - id: a
        text: kubectl describe pod api-7d9c
        code: true
        rationale: describe combines object details with conditions and related events, which commonly reveal scheduler rejection reasons.
      - id: b
        text: kubectl logs pod/api-7d9c
        code: true
        rationale: A Pending Pod may not have a running container with useful logs, and logs do not expose scheduler feasibility events.
      - id: c
        text: kubectl rollout undo pod/api-7d9c
        code: true
        rationale: Pods do not have Deployment rollout history and rollout undo is not a scheduling diagnostic.
      - id: d
        text: kubectl explain pod/api-7d9c
        code: true
        rationale: kubectl explain documents resource schema rather than the events for one live Pod.
    answer_ids: [a]
    explanation: For placement failures, inspect evidence from the scheduler path before debugging application code that has not started yet.
    unit_ids: [fpp:kubernetes-scheduling-placement]

  - id: practice:kcna/q-wide-pods
    checkpoint: cluster-behavior
    category: kubectl
    select: single
    prompt: Which command quickly shows Pods with extra placement and network columns such as node name and Pod IP?
    options:
      - id: a
        text: kubectl get pods -o wide
        code: true
        rationale: Wide output adds useful columns such as Pod IP and node placement to the normal Pod listing.
      - id: b
        text: kubectl get pods -o name
        code: true
        rationale: Name output intentionally returns only resource names and removes most diagnostic columns.
      - id: c
        text: kubectl explain pods.wide
        code: true
        rationale: Wide is an output mode, not an API field path for kubectl explain.
      - id: d
        text: kubectl logs pods --wide
        code: true
        rationale: Logs read container output and do not use wide table output for placement information.
    answer_ids: [a]
    explanation: Wide output is a fast observation step when you need to correlate a Pod with its node and Pod-network identity.
    unit_ids: [fpp:kubernetes-pod-model, fpp:kubernetes-networking-request-path]

  - id: practice:kcna/q-service-path
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: Which statements about a normal Kubernetes Service request path are correct? Select all that apply.
    options:
      - id: a
        text: A Service gives clients a stable virtual identity while backend Pods may change
        rationale: Service discovery decouples clients from the churn of individual Pod identities.
      - id: b
        text: EndpointSlices represent the selected backend endpoints for Services
        rationale: EndpointSlices are the scalable API representation of network endpoints associated with Services.
      - id: c
        text: CoreDNS normally creates replacement Pods when a Service endpoint disappears
        rationale: DNS resolves names; workload controllers, not CoreDNS, own Pod replacement.
      - id: d
        text: A NetworkPolicy can constrain allowed Pod traffic independently of Service discovery
        rationale: NetworkPolicy is a policy layer; it is distinct from DNS naming and Service endpoint selection.
    answer_ids: [a, b, d]
    explanation: Separate naming, stable service identity, endpoint selection, forwarding, and policy into different layers when tracing Kubernetes networking.
    unit_ids: [fpp:services-dns-ingress, fpp:kubernetes-networking-request-path]

  - id: practice:kcna/q-requests-limits
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: Which statements about CPU or memory requests and limits are correct? Select all that apply.
    options:
      - id: a
        text: Requests influence scheduler placement decisions
        rationale: The scheduler uses requested resources when evaluating whether a node has sufficient allocatable capacity.
      - id: b
        text: CPU limits can cause throttling at runtime
        rationale: CPU limits can be enforced by the runtime and kernel through cgroup CPU controls, which can throttle execution.
      - id: c
        text: Memory limits can contribute to OOM termination
        rationale: Exceeding an enforced memory limit can cause the container to be terminated for out-of-memory behavior.
      - id: d
        text: Limits are the only values the scheduler uses to decide whether a Pod fits
        rationale: Scheduling feasibility is primarily based on requests, so limits cannot simply replace requests in the placement model.
    answer_ids: [a, b, c]
    explanation: Requests answer “where can this fit?” while limits constrain runtime consumption; mixing those purposes produces bad scheduling reasoning.
    unit_ids: [fpp:scheduling-resources-health, fpp:kubernetes-scheduling-placement]

  - id: practice:kcna/q-probes
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: Which probe-to-purpose mappings are correct? Select all that apply.
    options:
      - id: a
        text: Readiness → whether the Pod should receive Service traffic
        rationale: A failing readiness probe removes the Pod from ready endpoints without necessarily restarting its container.
      - id: b
        text: Liveness → whether the container should be restarted because it is unhealthy
        rationale: Repeated liveness failure can trigger container restart by the kubelet.
      - id: c
        text: Startup → delay liveness/readiness behavior for slow-starting applications
        rationale: A startup probe protects slow-starting containers from premature liveness failure until startup succeeds.
      - id: d
        text: Readiness → reserve CPU on a node before scheduling
        rationale: Resource requests, not readiness probes, participate in scheduler capacity calculations.
    answer_ids: [a, b, c]
    explanation: Readiness, liveness, and startup probes answer different health questions; none replaces resource requests or end-to-end monitoring.
    unit_ids: [fpp:scheduling-resources-health]

  - id: practice:kcna/q-security-boundaries
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: A team creates a namespace named payments. Which additional mechanisms may still be needed for actual isolation or governance? Select all that apply.
    options:
      - id: a
        text: RBAC for API authorization
        rationale: Namespace existence does not automatically restrict which identities may perform API operations there.
      - id: b
        text: NetworkPolicy for Pod traffic restrictions
        rationale: A namespace alone does not automatically isolate network traffic between Pods or namespaces.
      - id: c
        text: ResourceQuota for aggregate namespace resource governance
        rationale: ResourceQuota can limit aggregate resource consumption in a namespace and is not implied by namespace creation.
      - id: d
        text: Nothing else; a namespace is a complete security boundary by itself
        rationale: Namespace primarily provides namespaced API scope and organization, not automatic network, authorization, or quota isolation.
    answer_ids: [a, b, c]
    explanation: Treat namespace as an API scope boundary, then add the security and governance mechanisms required by the threat and resource model.
    unit_ids: [fpp:kubernetes-namespaces-scope, fpp:kubernetes-security-access]

  - id: practice:kcna/q-live-yaml
    checkpoint: cluster-behavior
    category: kubectl
    select: single
    prompt: You want to inspect the full live Deployment object, including fields populated by the API and controllers. Which command is most direct?
    options:
      - id: a
        text: kubectl get deployment web -o yaml
        code: true
        rationale: This retrieves the live API object and serializes it as YAML for inspection.
      - id: b
        text: kubectl apply -f deployment.yaml
        code: true
        rationale: apply changes or reconciles live desired state and is not a read-only inspection command.
      - id: c
        text: kubectl rollout undo deployment/web
        code: true
        rationale: rollout undo mutates the Deployment revision instead of inspecting the current object.
      - id: d
        text: kubectl logs deployment/web -o yaml
        code: true
        rationale: Logs expose container output and do not serialize the Deployment API object.
    answer_ids: [a]
    explanation: Inspecting the live object is useful for separating what is actually stored in the API from what exists only in a local manifest file.
    unit_ids: [fpp:kubernetes-apply-live-state]

  - id: practice:kcna/q-gitops
    checkpoint: cloud-native
    category: concept
    select: single
    prompt: What is the most important distinguishing idea in a GitOps delivery model?
    options:
      - id: a
        text: Version-controlled desired state is reconciled continuously by automation
        rationale: GitOps combines declarative desired state in version control with an automated reconciliation loop toward that state.
      - id: b
        text: Engineers must SSH to every node and apply changes manually
        rationale: Manual node-by-node mutation conflicts with the declarative, reconciled GitOps operating model.
      - id: c
        text: Every deployment must build its image inside the Kubernetes API server
        rationale: Image build and desired-state reconciliation are separate concerns; the API server is not an image build engine.
      - id: d
        text: Git replaces observability because commit history explains runtime health
        rationale: Version history explains intended changes, but runtime observability is still required to prove actual behavior.
    answer_ids: [a]
    explanation: GitOps is not merely “using Git”; its core is declarative, versioned intent plus automated reconciliation and observable convergence.
    unit_ids: [fpp:cloud-native-delivery-gitops]

  - id: practice:kcna/q-observability-signals
    checkpoint: cloud-native
    category: concept
    select: multiple
    prompt: Which observability signal mappings are useful and generally correct? Select all that apply.
    options:
      - id: a
        text: Metrics → numeric behavior over time
        rationale: Metrics summarize measurements such as rates, counts, durations, and resource usage as time series.
      - id: b
        text: Logs → discrete application or system event records
        rationale: Logs record timestamped messages or structured events that help explain specific behavior.
      - id: c
        text: Traces → causal path and timing across distributed requests
        rationale: Distributed traces connect spans across services to show where a request traveled and how long work took.
      - id: d
        text: Kubernetes events → guaranteed long-term audit archive
        rationale: Kubernetes events are useful operational clues but should not be treated as a durable, complete audit-history system.
    answer_ids: [a, b, c]
    explanation: Observability comes from combining complementary evidence; no single signal fully proves system behavior across every layer.
    unit_ids: [fpp:cloud-native-observability-signals]

  - id: practice:kcna/q-release-proof
    checkpoint: cloud-native
    category: scenario
    select: single
    prompt: kubectl rollout status reports a Deployment completed successfully. What is the strongest conclusion you can safely make?
    options:
      - id: a
        text: The Deployment met its rollout completion conditions, but end-to-end user success still needs separate proof
        rationale: Controller-level rollout success is valuable evidence but does not prove DNS, routing, dependencies, or real user requests.
      - id: b
        text: Every external user in every region can reach the application successfully
        rationale: Rollout status cannot observe all network paths, dependencies, or external client experiences.
      - id: c
        text: The database migration was correct and reversible
        rationale: Deployment rollout state does not validate application data migrations or external side effects.
      - id: d
        text: No application error can occur until the next Deployment revision
        rationale: Runtime failures can happen after a successful rollout and need ongoing health and observability evidence.
    answer_ids: [a]
    explanation: Move from desired state to controller convergence to Pod health to routing and finally a real request; each layer proves something different.
    unit_ids: [fpp:kubernetes-deployments-rollouts, fpp:cloud-native-release-debugging]

  - id: practice:kcna/q-canary
    checkpoint: cloud-native
    category: concept
    select: single
    prompt: Which release idea deliberately exposes a new version to a limited portion of traffic or users before broader rollout?
    options:
      - id: a
        text: Canary release
        rationale: Canary delivery limits initial exposure so operators can compare behavior before increasing the new version's share.
      - id: b
        text: Backup restore
        rationale: Backup restore recovers data or system state and is not a progressive traffic-release strategy.
      - id: c
        text: Vertical scaling
        rationale: Vertical scaling changes resource capacity and does not define how versions receive traffic.
      - id: d
        text: Static linking
        rationale: Static linking is a build technique unrelated to progressive application release exposure.
    answer_ids: [a]
    explanation: Canary, blue-green, and rolling releases differ mainly in how versions coexist and how traffic or replica exposure changes over time.
    unit_ids: [fpp:cloud-native-release-debugging]

  - id: practice:kcna/q-logs-command
    checkpoint: cloud-native
    category: kubectl
    select: single
    prompt: A running Pod named api-7d9c has one container and you want its application stdout/stderr. Which command is the direct starting point?
    options:
      - id: a
        text: kubectl logs api-7d9c
        code: true
        rationale: kubectl logs retrieves container log output for the selected Pod and is the direct read path for stdout/stderr.
      - id: b
        text: kubectl explain api-7d9c
        code: true
        rationale: kubectl explain expects resource schema paths and does not read a Pod's runtime logs.
      - id: c
        text: kubectl rollout status api-7d9c
        code: true
        rationale: A Pod is not a rollout controller and rollout status does not retrieve application log output.
      - id: d
        text: kubectl get api-7d9c --stdout
        code: true
        rationale: kubectl get reads API resources and does not expose container stdout with this command form.
    answer_ids: [a]
    explanation: Logs are application-process evidence. If the container never started, move earlier in the evidence ladder to Pod state, events, image pull, or scheduling.
    unit_ids: [fpp:troubleshoot-process-to-pod, fpp:cloud-native-observability-signals]

  - id: practice:kcna/q-exec-command
    checkpoint: cloud-native
    category: kubectl
    select: single
    prompt: A running Pod named api-7d9c contains a shell and you need an interactive shell inside its container for a short diagnostic. Which command shape is correct?
    options:
      - id: a
        text: kubectl exec -it api-7d9c -- sh
        code: true
        rationale: kubectl exec runs a command in a running container; -it requests an interactive terminal and -- separates kubectl flags from the command.
      - id: b
        text: kubectl logs -it api-7d9c -- sh
        code: true
        rationale: kubectl logs reads container output and does not execute a shell in the container.
      - id: c
        text: kubectl apply -it api-7d9c -- sh
        code: true
        rationale: kubectl apply reconciles declarative API configuration and cannot open an interactive process this way.
      - id: d
        text: kubectl explain -it api-7d9c -- sh
        code: true
        rationale: kubectl explain is schema documentation and does not run commands inside containers.
    answer_ids: [a]
    explanation: kubectl exec is a runtime diagnostic tool. It should complement, not replace, reproducible configuration and observable application behavior.
    unit_ids: [fpp:troubleshoot-process-to-pod]

  - id: practice:kcna/q-debug-order
    checkpoint: cloud-native
    category: scenario
    select: single
    prompt: kubectl apply succeeded but users still receive errors. Which troubleshooting approach best preserves the evidence chain?
    options:
      - id: a
        text: Verify live desired state, rollout and Pod state, endpoints or routing, then a real request
        rationale: This follows the system from API acceptance through reconciliation and networking to user-visible behavior, localizing the first failing layer.
      - id: b
        text: Reapply the same manifest repeatedly until the error disappears
        rationale: Repeating a successful API operation without new evidence can hide the actual failing downstream layer.
      - id: c
        text: Delete every Pod before checking any status or events
        rationale: Destructive changes erase useful evidence and may create additional churn before the failure is understood.
      - id: d
        text: Assume API acceptance proves the application and its dependencies are healthy
        rationale: API success only proves an API operation; many downstream runtime and network failures can still occur.
    answer_ids: [a]
    explanation: Good debugging moves layer by layer and uses observable proof at each transition instead of guessing or mutating the system prematurely.
    unit_ids: [fpp:troubleshoot-process-to-pod, fpp:cloud-native-release-debugging]

  - id: practice:kcna/q-scheduler-filter-score-bind
    checkpoint: cluster-behavior
    category: concept
    select: single
    prompt: An ordinary Pod has no node assignment yet. Which sequence best describes the placement decision before the kubelet starts executing it?
    options:
      - id: a
        text: Filter infeasible nodes → score feasible nodes → bind the Pod → kubelet executes on the selected node
        rationale: This separates scheduler feasibility and ranking from the node-side execution that follows a recorded assignment.
      - id: b
        text: Kubelet scores every node → CoreDNS binds the Pod → scheduler starts the containers
        rationale: Kubelet and CoreDNS do not own cluster-level placement, and kube-scheduler does not start application containers.
      - id: c
        text: etcd selects a node → controller-manager starts the Pod → scheduler records logs
        rationale: etcd persists API state and controller-manager runs reconciliation loops; neither replaces scheduler selection or kubelet execution.
      - id: d
        text: Scheduler starts containers on every node → removes all but the best candidate
        rationale: Kubernetes does not execute the Pod on every candidate before choosing one; feasibility and scoring happen before node-side execution.
    answer_ids: [a]
    explanation: Scheduling answers where an unassigned Pod should run. After the scheduler records the chosen node, kubelet and the runtime execute the Pod there.
    unit_ids: [fpp:kcna-scheduling-review, fpp:kubernetes-scheduling-placement]

  - id: practice:kcna/q-nodename-bypass
    checkpoint: cluster-behavior
    category: scenario
    select: single
    prompt: A Pod specifies spec.nodeName directly. Which statement best distinguishes that from nodeSelector or node affinity?
    options:
      - id: a
        text: nodeName is a preferred scoring hint that the scheduler may ignore
        rationale: nodeName is a direct node assignment, not a weighted scheduler preference.
      - id: b
        text: nodeName directly assigns the Pod and bypasses ordinary scheduler selection
        rationale: Direct node assignment avoids the normal scheduler selection path used by selectors and affinity.
      - id: c
        text: nodeName automatically creates the named node if it does not exist
        rationale: Pod placement fields never provision a missing Kubernetes Node object or underlying machine.
      - id: d
        text: nodeName is another spelling of preferredDuringSchedulingIgnoredDuringExecution
        rationale: Preferred affinity influences scoring while nodeName bypasses scheduler choice entirely.
    answer_ids: [b]
    explanation: nodeSelector and node affinity constrain scheduler reasoning. nodeName names the target node directly and should be treated as a different, exceptional placement path.
    unit_ids: [fpp:kcna-scheduling-review]

  - id: practice:kcna/q-affinity-semantics
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: Which statements about common node-affinity terms are correct? Select all that apply.
    options:
      - id: a
        text: requiredDuringSchedulingIgnoredDuringExecution is a hard scheduling-time node filter
        rationale: Nodes that fail a required node-affinity term are not feasible candidates for the Pod at scheduling time.
      - id: b
        text: preferredDuringSchedulingIgnoredDuringExecution influences scoring but does not guarantee placement
        rationale: Preferred affinity contributes weights among feasible nodes instead of excluding every nonmatching node.
      - id: c
        text: IgnoredDuringExecution means a later node-label change automatically evicts the Pod
        rationale: The term means the affinity is not continuously enforced as an automatic eviction rule after scheduling.
      - id: d
        text: Node affinity can express richer label conditions than a simple nodeSelector
        rationale: Node affinity supports expressions and operators beyond nodeSelector's simple exact-match form.
    answer_ids: [a, b, d]
    explanation: Required affinity filters, preferred affinity scores, and the common IgnoredDuringExecution forms do not automatically evict a running Pod merely because relevant node labels later change.
    unit_ids: [fpp:kcna-scheduling-review, fpp:kubernetes-scheduling-placement]

  - id: practice:kcna/q-taint-effects
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: Which statements correctly distinguish Kubernetes taint effects and tolerations? Select all that apply.
    options:
      - id: a
        text: NoSchedule prevents new non-tolerating Pods from being scheduled onto the tainted node through normal scheduling
        rationale: NoSchedule is a hard scheduler-side rejection for Pods that do not tolerate the matching taint.
      - id: b
        text: PreferNoSchedule expresses a preference to avoid placing non-tolerating Pods on the node
        rationale: PreferNoSchedule is a soft avoidance policy rather than an absolute scheduling prohibition.
      - id: c
        text: NoExecute can also evict already-bound Pods that do not tolerate the taint
        rationale: NoExecute applies to both new placement and continued execution for Pods without a matching toleration.
      - id: d
        text: A matching toleration guarantees the Pod will be scheduled onto that tainted node
        rationale: A toleration only removes the matching taint as a rejection reason; other feasible nodes and constraints still participate.
    answer_ids: [a, b, c]
    explanation: Taints repel; tolerations permit. NoSchedule is hard for new scheduling, PreferNoSchedule is soft, and NoExecute can affect already-running Pods as well.
    unit_ids: [fpp:kcna-scheduling-review, fpp:kubernetes-scheduling-placement]

  - id: practice:kcna/q-resource-layering
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: Which resource-policy statements are correct? Select all that apply.
    options:
      - id: a
        text: Resource requests participate in scheduler feasibility against node allocatable capacity
        rationale: The scheduler uses declared requests rather than relying only on instantaneous utilization when determining resource fit.
      - id: b
        text: CPU limits are primarily runtime enforcement boundaries and can cause throttling
        rationale: CPU limit enforcement happens during execution rather than acting as the same scheduling reservation as a request.
      - id: c
        text: ResourceQuota can govern aggregate namespace resource consumption or object counts
        rationale: ResourceQuota provides namespace-wide aggregate governance rather than per-container defaults.
      - id: d
        text: LimitRange is the normal mechanism for choosing which node receives the Pod
        rationale: LimitRange controls defaults and per-object resource constraints in a namespace; it is not a node-selection mechanism.
    answer_ids: [a, b, c]
    explanation: Requests, runtime limits, per-object namespace policy, and aggregate namespace quotas are separate resource-management layers.
    unit_ids: [fpp:kcna-scheduling-review, fpp:scheduling-resources-health]

  - id: practice:kcna/q-limitrange-resourcequota
    checkpoint: cluster-behavior
    category: scenario
    select: single
    prompt: A namespace needs a default memory request for containers that omit one and also a hard aggregate cap on total requested memory. Which pair fits those requirements?
    options:
      - id: a
        text: LimitRange for the default; ResourceQuota for the aggregate cap
        rationale: LimitRange can default or bound individual object resources, while ResourceQuota governs namespace-wide aggregate consumption.
      - id: b
        text: ResourceQuota for the default; nodeSelector for the aggregate cap
        rationale: ResourceQuota does not provide the same per-container defaulting role, and nodeSelector is unrelated to namespace budgets.
      - id: c
        text: Toleration for the default; LimitRange for node selection
        rationale: Tolerations are scheduling permissions and LimitRange is resource admission policy, not node selection.
      - id: d
        text: Deployment strategy for both requirements
        rationale: Deployment rollout strategy controls replacement behavior and does not define namespace resource governance.
    answer_ids: [a]
    explanation: LimitRange is the per-object/default policy layer; ResourceQuota is the aggregate namespace governance layer.
    unit_ids: [fpp:kcna-scheduling-review]

  - id: practice:kcna/q-daemonset-static-pod
    checkpoint: cluster-behavior
    category: scenario
    select: single
    prompt: Which statement correctly distinguishes a DaemonSet Pod from a static Pod?
    options:
      - id: a
        text: Both are directly owned by kubelet from node-local manifests
        rationale: DaemonSet Pods are created through a control-plane controller, while static Pods are directly kubelet-owned.
      - id: b
        text: A DaemonSet controller creates Pods for eligible nodes, while a static Pod is directly managed by one kubelet from static configuration
        rationale: This is the key ownership distinction even though both patterns can be used for node-local software.
      - id: c
        text: Static Pods require a Deployment to maintain their replicas
        rationale: Static Pods do not depend on Deployments or other normal workload controllers for their node-local lifecycle.
      - id: d
        text: Deleting a static Pod's mirror object through the API permanently stops the underlying static Pod
        rationale: The mirror is API visibility for a kubelet-owned static Pod; deleting it does not remove the underlying static configuration.
    answer_ids: [b]
    explanation: DaemonSet ownership begins in the control plane and normally includes scheduler placement; static Pod ownership begins directly at a node's kubelet.
    unit_ids: [fpp:kcna-scheduling-review]

  - id: practice:kcna/q-custom-scheduler-name
    checkpoint: cluster-behavior
    category: scenario
    select: single
    prompt: A Pod has spec.schedulerName set to research-scheduler, but no scheduler or configured profile handles that name. What is the most likely scheduling outcome?
    options:
      - id: a
        text: The default scheduler silently takes over after a short timeout
        rationale: Arbitrary scheduler names are not automatically treated as fallback aliases for the default scheduler.
      - id: b
        text: The Pod can remain unassigned because no scheduler owns its requested scheduling name
        rationale: schedulerName selects the scheduling responsibility, so a missing matching scheduler can leave placement undone.
      - id: c
        text: The kubelet with the most free CPU chooses itself automatically
        rationale: Kubelets execute workloads assigned to their nodes and do not normally perform cluster-wide selection for unscheduled Pods.
      - id: d
        text: CoreDNS assigns the Pod to the node with the closest IP address
        rationale: DNS provides name resolution and does not perform Pod scheduling.
    answer_ids: [b]
    explanation: Custom schedulers and scheduler profiles are opt-in placement owners. schedulerName must correspond to behavior that actually exists in the cluster.
    unit_ids: [fpp:kcna-scheduling-review]

  - id: practice:kcna/q-scheduler-profiles-plugins
    checkpoint: cluster-behavior
    category: concept
    select: single
    prompt: What is the best KCNA-level mental model for kube-scheduler profiles and scheduling plugins?
    options:
      - id: a
        text: Profiles can expose named scheduling behavior, while plugins participate in phases such as filtering and scoring
        rationale: Kubernetes scheduler configuration composes scheduling behavior through framework plugins and can expose more than one profile name.
      - id: b
        text: Profiles are container runtimes and plugins replace kubelet on selected nodes
        rationale: Scheduler profiles and plugins stay in the scheduling control-plane boundary; they do not execute containers.
      - id: c
        text: Every profile runs a separate etcd database for its Pods
        rationale: Scheduler profiles do not imply separate cluster-state stores; accepted Pod and Node state remains Kubernetes API state.
      - id: d
        text: Plugins are only post-start shell hooks executed inside application containers
        rationale: Scheduling plugins participate in scheduler framework extension points rather than application-container startup hooks.
    answer_ids: [a]
    explanation: Think of the scheduler as a framework with named profiles and phase-specific plugins, not as one hard-coded best-node formula.
    unit_ids: [fpp:kcna-scheduling-review]

  - id: practice:kcna/q-priority-class-queue
    checkpoint: cluster-behavior
    category: scenario
    select: multiple
    prompt: A high-priority Pod and a normal-priority Pod are both Pending. Which statements about the high-priority Pod are correct? Select all that apply.
    options:
      - id: a
        text: Its priority can make it be considered before lower-priority pending work
        rationale: Pod priority is used by scheduler queue ordering so higher-priority work can be attempted first.
      - id: b
        text: Its priority can participate in preemption when a suitable node might be made feasible by removing lower-priority Pods
        rationale: Priority and preemption are related, although preemption still has constraints and does not guarantee success.
      - id: c
        text: Its priority lets it ignore an untolerated NoSchedule taint
        rationale: Priority does not bypass taint filtering; a hard placement constraint still makes the node infeasible for that Pod.
      - id: d
        text: It can still remain Pending if no node satisfies its hard scheduling constraints
        rationale: Queue order changes which Pod is attempted first, not whether impossible resource or placement requirements become feasible.
    answer_ids: [a, b, d]
    explanation: Priority influences scheduler queue order and can affect preemption. It does not override resource fit, required affinity, taints, or other hard feasibility rules.
    unit_ids: [fpp:kcna-scheduling-review]

  - id: practice:kcna/q-scheduler-framework-phases
    checkpoint: cluster-behavior
    category: concept
    select: multiple
    prompt: Which scheduler-framework pairings are conceptually correct? Select all that apply.
    options:
      - id: a
        text: QueueSort → choose which pending Pod is considered next
        rationale: QueueSort plugins order queued Pods before an individual scheduling attempt proceeds.
      - id: b
        text: Filter → remove nodes that cannot satisfy hard requirements
        rationale: Filter plugins decide whether each candidate node is feasible for the Pod.
      - id: c
        text: Score → rank nodes that survived filtering
        rationale: Score plugins express preference among feasible candidates.
      - id: d
        text: Bind → start the Pod's application containers on the selected worker
        rationale: Binding records Pod-to-node assignment. Kubelet and the container runtime perform node-side execution afterward.
    answer_ids: [a, b, c]
    explanation: The framework separates queue ordering, node feasibility, node preference, and binding. Node-side container execution starts after scheduling has recorded placement.
    unit_ids: [fpp:kcna-scheduling-review]

  - id: practice:kcna/q-dedicated-gpu-placement
    checkpoint: cluster-behavior
    category: scenario
    select: multiple
    prompt: You want ordinary workloads kept off GPU nodes and GPU workloads required to use GPU nodes. Which controls together express that policy? Select all that apply.
    options:
      - id: a
        text: Taint the GPU nodes so ordinary Pods without a toleration are repelled
        rationale: A taint expresses the node-side repulsion needed to keep general workloads away unless they are explicitly permitted.
      - id: b
        text: Give GPU workloads the matching toleration
        rationale: The toleration makes the tainted GPU nodes eligible for the intended workload but does not by itself require those nodes.
      - id: c
        text: Give GPU workloads required node selection or affinity for a trusted GPU node label
        rationale: A hard label-based placement rule supplies the missing attraction or requirement toward the GPU node class.
      - id: d
        text: Rely only on the toleration because tolerations force Pods onto the matching tainted nodes
        rationale: Tolerations are permissive; they do not guarantee or require placement on the tainted nodes.
    answer_ids: [a, b, c]
    explanation: "Dedicated-node design commonly combines repulsion and attraction: taint the special nodes, tolerate them for the intended workload, then require the intended node class with trusted labels and selection or affinity."
    unit_ids: [fpp:kcna-scheduling-review, fpp:kubernetes-scheduling-placement]
